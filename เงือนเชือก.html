            { id: 'Decorative', label: 'อื่นๆ', icon: Icons.Zap },
        ];

        // --- COMPONENTS ---

        const HtmlLayout = ({ children }) => (
            <div className="min-h-screen bg-gray-100 flex justify-center p-0 md:p-4 pb-16 md:pb-4">
                <div className="w-full md:w-[800px] h-[100vh] md:h-[90vh] bg-white border-x-0 md:border-2 border-black md:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] flex flex-col relative overflow-hidden">
                    {children}
                </div>
            </div>
        );

        const TopMenu = ({ activeCategory, setActiveCategory, searchTerm, setSearchTerm, onToggleFavorites, onRefresh }) => (
            <div className="w-full bg-white border-b-2 border-black flex flex-col z-20">
                {/* Row 1: Logo, Search, Actions */}
                <div className="flex flex-col md:flex-row border-b border-black">
                    <div className="p-2 bg-yellow-300 border-b border-black md:border-b-0 md:border-r-2 md:w-48 flex-shrink-0 flex items-center justify-between">
                        <h1 className="font-bold text-sm uppercase flex items-center gap-2">
                            <Icons.Globe width={16} height={16} /> KNOTS_APP
                        </h1>
                        <span className="text-[10px] bg-black text-white px-1">v2.0</span>
                    </div>

                    <div className="flex-1 p-2 flex items-center gap-2 bg-white">
                        {/* Search Bar */}
                        <div className="flex flex-1 items-center border-2 border-black h-8 bg-white">
                            <input 
                                type="text"
                                className="w-full h-full px-2 text-xs outline-none bg-transparent"
                                placeholder="ค้นหา..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                            />
                            <div className="h-full w-8 bg-black flex items-center justify-center text-white">
                                <Icons.Search width={14} height={14} />
                            </div>
                        </div>

                        {/* Right Side Actions (Requested: Favorites next to Refresh) */}
                        <div className="flex gap-2">
                             <button 
                                onClick={onToggleFavorites}
                                className="h-8 px-2 bg-pink-100 border-2 border-black hover:bg-pink-200 active:translate-y-0.5 flex items-center gap-1"
                                title="รายการโปรด"
                            >
                                <Icons.Heart width={16} height={16} fill="#ec4899" className="text-pink-500" />
                                <span className="text-[10px] font-bold hidden sm:inline">SAVED</span>
                            </button>
                            <button 
                                onClick={onRefresh}
                                className="h-8 w-8 bg-gray-200 border-2 border-black flex items-center justify-center hover:bg-gray-300 active:translate-y-0.5 hover:rotate-180 transition-transform duration-300"
                                title="รีเฟรช"
                            >
                                <Icons.Refresh width={16} height={16} />
                            </button>
                        </div>
                    </div>
                </div>

                {/* Row 2: Categories */}
                <div className="bg-white overflow-x-auto hide-scroll border-black">
                    <div className="flex p-2 gap-2 min-w-max">
                        {CATEGORIES.map((cat) => (
                            <button
                                key={cat.id}
                                onClick={() => setActiveCategory(cat.id)}
                                className={`
                                    px-3 py-1 text-[11px] border border-black flex items-center gap-1.5 transition-all whitespace-nowrap rounded-full
                                    ${activeCategory === cat.id 
                                        ? 'bg-black text-white font-bold shadow-none' 
                                        : 'bg-white text-black hover:bg-gray-100 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]'}
                                `}
                            >
                                {cat.label}
                            </button>
                        ))}
                    </div>
                </div>
            </div>
        );

        const BottomNavigation = ({ activeTab, onNavigate }) => (
            <div className="absolute bottom-0 left-0 w-full h-16 bg-white border-t-2 border-black flex justify-around items-center z-30 pb-2 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
                <button 
                    onClick={() => onNavigate('home')}
                    className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${activeTab === 'home' ? 'text-blue-700' : 'text-gray-500 hover:text-black'}`}
                >
                    <Icons.Home width={24} height={24} strokeWidth={activeTab === 'home' ? 2.5 : 2} />
                    <span className={`text-[10px] font-bold ${activeTab === 'home' ? 'opacity-100' : 'opacity-70'}`}>หน้าแรก</span>
                </button>

                <div className="w-[1px] h-8 bg-gray-300"></div>

                <button 
                    onClick={() => onNavigate('favorites')}
                    className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${activeTab === 'favorites' ? 'text-pink-600' : 'text-gray-500 hover:text-pink-500'}`}
                >
                    <Icons.Heart width={24} height={24} fill={activeTab === 'favorites' ? "currentColor" : "none"} strokeWidth={activeTab === 'favorites' ? 2.5 : 2} />
                    <span className={`text-[10px] font-bold ${activeTab === 'favorites' ? 'opacity-100' : 'opacity-70'}`}>รายการโปรด</span>
                </button>
            </div>
        );

        const DifficultyBadge = ({ level }) => {
            const config = {
                'Very Easy': { label: 'ง่ายมาก', color: 'bg-green-200' },
                'Easy': { label: 'ง่าย', color: 'bg-blue-200' },
                'Medium': { label: 'ปานกลาง', color: 'bg-yellow-200' },
                'Hard': { label: 'ยาก', color: 'bg-orange-200' },
                'Very Hard': { label: 'ยากมาก', color: 'bg-red-200' }
            };
            const { label, color } = config[level] || { label: level, color: 'bg-gray-200' };

            return (
                <span className={`text-[9px] uppercase border border-black px-1.5 py-0.5 rounded-sm text-black ${color} font-bold`}>
                    {label}
                </span>
            );
        };

        const KnotEntry = ({ knot, onClick, isFavorite, onToggleFav }) => (
            <div 
                className="relative border border-black p-3 cursor-pointer bg-white h-full flex flex-col hover:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all active:translate-x-[1px] active:translate-y-[1px] active:shadow-none group"
                onClick={() => onClick(knot)}
            >
                <div className="flex justify-between items-start mb-2 pb-2 border-b border-dashed border-gray-400">
                    <div className="flex-1 pr-2">
                        <span className="font-bold text-blue-700 text-sm block">
                            #{knot.id} {knot.name.split('(')[0]}
                        </span>
                    </div>
                    <DifficultyBadge level={knot.difficulty} />
                </div>

                <div className="text-xs space-y-2 flex-1">
                    <p className="font-bold text-gray-800">{knot.name.split('(')[1]?.replace(')', '') || 'English Name'}</p>
                    <p className="text-gray-600 line-clamp-2 text-[11px]">
                        <span className="text-black font-bold">USE:</span> {knot.usage}
                    </p>
                </div>

                {/* Favorite Button on Card */}
                <button 
                    onClick={(e) => {
                        e.stopPropagation();
                        onToggleFav(knot.id);
                    }}
                    className={`absolute bottom-2 right-2 p-1.5 border border-black rounded-full transition-colors z-10 ${isFavorite ? 'bg-pink-500 text-white' : 'bg-white text-gray-300 hover:text-pink-400'}`}
                >
                    <Icons.Heart width={14} height={14} fill={isFavorite ? "currentColor" : "none"} />
                </button>
            </div>
        );

        const HtmlDialog = ({ knot, onClose, isFavorite, onToggleFav }) => {
            if (!knot) return null;
            const [showVideo, setShowVideo] = useState(false);
            
            const imageUrl = knot.imageUrl || `https://placehold.co/600x400/EEE/31343C?font=roboto&text=${encodeURIComponent(knot.name.split('(')[0])}`;
            const videoId = knot.youtubeId || "V7_GzJp2j2U";

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fadeIn">
                    <div className="bg-white w-full max-w-md border-2 border-black shadow-[10px_10px_0px_0px_rgba(255,255,255,1)] flex flex-col max-h-[85vh] md:max-h-[90vh]">
                        
                        {/* Header */}
                        <div className="bg-blue-700 text-white p-3 flex justify-between items-center border-b-2 border-black flex-shrink-0">
                            <span className="font-bold text-sm flex items-center gap-2 truncate pr-4">
                                <Icons.Info width={16} height={16} /> {knot.name}
                            </span>
                            <button onClick={onClose} className="bg-red-500 text-white w-6 h-6 flex items-center justify-center border border-black font-bold hover:bg-red-600">
                                X
                            </button>
                        </div>

                        {/* Content */}
                        <div className="p-4 overflow-y-auto custom-scrollbar flex-1 bg-white">
                            
                            {/* Actions Bar inside Dialog */}
                            <div className="flex justify-between items-center mb-4">
                                <DifficultyBadge level={knot.difficulty} />
                                <button 
                                    onClick={() => onToggleFav(knot.id)}
                                    className={`flex items-center gap-2 px-3 py-1 border border-black text-xs font-bold transition-all ${isFavorite ? 'bg-pink-100 text-pink-600' : 'bg-gray-100 text-gray-500 hover:bg-pink-50'}`}
                                >
                                    <Icons.Heart width={14} height={14} fill={isFavorite ? "currentColor" : "none"} />
                                    {isFavorite ? 'บันทึกแล้ว' : 'บันทึกรายการ'}
                                </button>
                            </div>

                            <div className="mb-4 border-2 border-black bg-black">
                                {showVideo ? (
                                    <div className="relative pt-[56.25%] w-full">
                                        <iframe 
                                            className="absolute inset-0 w-full h-full"
                                            src={`https://www.youtube.com/embed/${videoId}?autoplay=1`}
                                            title="YouTube video player"
                                            frameBorder="0"
                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                            allowFullScreen
                                        ></iframe>
                                    </div>
                                ) : (
                                    <div className="relative group bg-gray-100 flex items-center justify-center min-h-[200px]">
                                        <img 
                                            src={imageUrl} 
                                            alt={knot.name} 
                                            className="w-full h-auto object-cover block max-h-[250px]" 
                                            onError={(e) => {
                                                e.target.onerror = null; 
                                                e.target.src='https://placehold.co/600x400/EEE/31343C?font=roboto&text=No+Image'
                                            }}
                                        />
                                    </div>
                                )}
                            </div>

                            <div className="flex justify-center mb-6">
                                <button 
                                    onClick={() => setShowVideo(!showVideo)}
                                    className={`flex items-center gap-2 px-4 py-2 border-2 border-black font-bold shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all text-xs ${showVideo ? 'bg-white text-black' : 'bg-red-600 text-white'}`}
                                >
                                    {showVideo ? (
                                        <><Icons.Image width={14} height={14} /> ดูรูปภาพ</>
                                    ) : (
                                        <><Icons.Play width={14} height={14} fill="currentColor" /> ดูวิดีโอสาธิต</>
                                    )}
                                </button>
                            </div>
                            
                            <table className="w-full border-2 border-black mb-6 text-xs">
                                <tbody>
                                    <tr className="border-b border-black">
                                        <td className="bg-gray-100 p-2 border-r border-black w-1/3 font-bold">หมวดหมู่</td>
                                        <td className="p-2">{knot.category}</td>
                                    </tr>
                                    <tr className="border-b border-black">
                                        <td className="bg-gray-100 p-2 border-r border-black font-bold">การใช้งาน</td>
                                        <td className="p-2">{knot.usage}</td>
                                    </tr>
                                </tbody>
                            </table>

                            <div className="border-2 border-black p-4 bg-yellow-50 relative mt-4">
                                <span className="absolute -top-3 left-4 bg-white border border-black px-2 text-[10px] font-bold">STEPS / วิธีทำ</span>
                                <ol className="list-decimal list-inside space-y-3 text-sm mt-1">
                                    {knot.steps.map((step, idx) => (
                                        <li key={idx} className="pl-1 leading-snug text-gray-800">
                                            {step}
                                        </li>
                                    ))}
                                </ol>
                            </div>
                        </div>

                        {/* Footer */}
                        <div className="p-3 border-t-2 border-black bg-gray-100 flex justify-end">
                            <button onClick={onClose} className="px-6 py-2 bg-white border-2 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-x-[1px] active:translate-y-[1px] text-xs font-bold hover:bg-gray-50">
                                ปิดหน้าต่าง
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const FavoritesDialog = ({ favorites, allKnots, onClose, onToggleFav, onSelectKnot }) => {
            const favKnots = allKnots.filter(k => favorites.includes(k.id));

            return (
                <div className="fixed inset-0 z-40 flex items-center justify-center p-4 bg-white/90 backdrop-grayscale animate-fadeIn">
                    <div className="bg-white w-full max-w-md h-[80vh] border-2 border-black shadow-[8px_8px_0px_0px_pink] flex flex-col">
                        <div className="bg-pink-500 text-white p-3 flex justify-between items-center border-b-2 border-black">
                            <h2 className="font-bold text-lg flex items-center gap-2">
                                <Icons.Heart width={20} height={20} fill="white" /> รายการโปรด ({favKnots.length})
                            </h2>
                            <button onClick={onClose} className="text-white hover:text-black font-bold">Close</button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 custom-scrollbar bg-[url('https://www.transparenttextures.com/patterns/graphy.png')]">
                            {favKnots.length > 0 ? (
                                <div className="space-y-3">
                                    {favKnots.map(knot => (
                                        <div key={knot.id} onClick={() => onSelectKnot(knot)} className="flex items-center justify-between border border-black bg-white p-3 cursor-pointer hover:bg-pink-50 shadow-sm">
                                            <div>
                                                <div className="font-bold text-sm text-blue-800">{knot.name}</div>
                                                <div className="text-xs text-gray-500">{knot.category}</div>
                                            </div>
                                            <button 
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    onToggleFav(knot.id);
                                                }}
                                                className="text-red-500 hover:text-red-700 p-2"
                                            >
                                                <Icons.Heart width={16} height={16} fill="currentColor" />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="h-full flex flex-col items-center justify-center text-gray-400 space-y-4">
                                    <Icons.Heart width={48} height={48} />
                                    <p className="text-center font-mono">ยังไม่มีรายการที่บันทึกไว้<br/>กดหัวใจเพื่อเพิ่มรายการ</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [searchTerm, setSearchTerm] = useState("");
            const [activeCategory, setActiveCategory] = useState("All");
            const [selectedKnot, setSelectedKnot] = useState(null);
            const [showFavorites, setShowFavorites] = useState(false);
            
            // Local Storage Logic
            const [favorites, setFavorites] = useState(() => {
                try {
                    const saved = localStorage.getItem('knots_favorites');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });

            useEffect(() => {
                localStorage.setItem('knots_favorites', JSON.stringify(favorites));
            }, [favorites]);

            const toggleFavorite = (id) => {
                setFavorites(prev => 
                    prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
                );
            };

            const handleRefresh = () => {
                setSearchTerm("");
                setActiveCategory("All");
                // Optional: window.location.reload() for hard refresh
            };

            const filteredKnots = useMemo(() => {
                return KNOTS_DATA.filter(knot => {
                    const lowerSearch = searchTerm.toLowerCase();
                    const lowerName = knot.name.toLowerCase();
                    const matchesSearch = lowerName.includes(lowerSearch) || knot.usage.toLowerCase().includes(lowerSearch);
                    
                    const categoryMatch = activeCategory === "All" 
                        ? true 
                        : activeCategory === "Decorative" 
                            ? (knot.category === "Decorative" || knot.category === "General")
                            : knot.category === activeCategory;
                    
                    return matchesSearch && categoryMatch;
                });
            }, [searchTerm, activeCategory]);

            return (
                <HtmlLayout>
                    <TopMenu 
                        activeCategory={activeCategory} 
                        setActiveCategory={setActiveCategory}
                        searchTerm={searchTerm}
                        setSearchTerm={setSearchTerm}
                        onToggleFavorites={() => setShowFavorites(true)}
                        onRefresh={handleRefresh}
                    />
                    
                    <main className="flex-1 overflow-y-auto p-4 custom-scrollbar bg-gray-50 pb-20 relative">
                        {/* Background Pattern */}
                        <div className="absolute inset-0 opacity-10 pointer-events-none" style={{backgroundImage: 'radial-gradient(#000 1px, transparent 1px)', backgroundSize: '20px 20px'}}></div>

                        <div className="relative z-10">
                            <div className="mb-4 text-xs font-bold border-b-2 border-gray-300 pb-1 flex justify-between text-gray-500">
                                <span>RESULTS: {filteredKnots.length}</span>
                                <span>MODE: LIST_VIEW</span>
                            </div>

                            {filteredKnots.length > 0 ? (
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                    {filteredKnots.map((knot) => (
                                        <KnotEntry 
                                            key={knot.id} 
                                            knot={knot} 
                                            onClick={setSelectedKnot} 
                                            isFavorite={favorites.includes(knot.id)}
                                            onToggleFav={toggleFavorite}
                                        />
                                    ))}
                                </div>
                            ) : (
                                <div className="p-10 border-2 border-black border-dashed text-center bg-white mt-10">
                                    <p className="font-bold text-red-600 mb-2">NOT FOUND</p>
                                    <p className="text-xs text-gray-500">ไม่พบเงื่อนที่คุณค้นหา</p>
                                    <button onClick={handleRefresh} className="mt-4 underline text-blue-600 text-xs">ล้างการค้นหา</button>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Bottom Navigation */}
                    <BottomNavigation 
                        activeTab={showFavorites ? 'favorites' : 'home'}
                        onNavigate={(tab) => {
                            if (tab === 'home') {
                                setShowFavorites(false);
                                handleRefresh(); // Optional: reset view on home click
                            } else if (tab === 'favorites') {
                                setShowFavorites(true);
                            }
                        }}
                    />

                    {/* Dialogs */}
                    {selectedKnot && (
                        <HtmlDialog 
                            knot={selectedKnot} 
                            onClose={() => setSelectedKnot(null)} 
                            isFavorite={favorites.includes(selectedKnot.id)}
                            onToggleFav={toggleFavorite}
                        />
                    )}

                    {showFavorites && (
                        <FavoritesDialog 
                            favorites={favorites}
                            allKnots={KNOTS_DATA}
                            onClose={() => setShowFavorites(false)}
                            onToggleFav={toggleFavorite}
                            onSelectKnot={(knot) => {
                                setSelectedKnot(knot);
                                setShowFavorites(false); // Close list to show detail
                            }}
                        />
                    )}
                </HtmlLayout>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
