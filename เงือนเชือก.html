<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Knots Database App</title>
    
    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Prompt', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc; /* slate-50 */
        }
        
        /* Modern Soft Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* Hide scrollbar for category list but keep functionality */
        .hide-scroll::-webkit-scrollbar {
            display: none;
        }
        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Smooth animation classes */
        .animate-fadeIn {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-slate-800 text-sm leading-relaxed overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- ICONS (SVG Components) ---
        const Icons = {
            Search: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            Globe: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>,
            Info: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>,
            Play: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>,
            Image: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>,
            Book: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>,
            Anchor: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="5" r="3"/><line x1="12" x2="12" y1="22" y2="8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></svg>,
            Tent: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 20 10 4 1 20"/><path d="m12.8 12.8-3.1-3.1"/><path d="M2 20h20"/><path d="M8.5 14H4"/><path d="M9 12.5 15.5 20"/><path d="M15 9l-4.5 4.5"/><path d="M14.5 20h5"/></svg>,
            Fish: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6.5 12c.6-2.5 3.1-4.5 5.5-4.5 2.5 0 5.5 2.5 5.5 5.5 0 2.5-2.5 5.5-5.5 5.5-2.5 0-5-2-5.5-4.5Z"/><path d="M22 12c-2.7 0-4.3-1-5.5-1.5a16 16 0 0 0-9 0C5.3 11 2.7 12 2 12c-.7 0-3.3-1-5.5-1.5a16 16 0 0 0 9 0c1.2.5 2.8 1.5 5.5 1.5Z"/><path d="M14.5 12a2.5 2.5 0 0 0-2.5-2.5"/><path d="M22 12c-2.7 0-4.3 1-5.5 1.5"/></svg>,
            Mountain: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>,
            Package: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22v-9"/></svg>,
            Zap: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
            Heart: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill={props.fill || "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>,
            Home: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Refresh: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>,
            ChevronLeft: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        };

        // --- DATA ---
        // ข้อมูลถูกย้ายไปดึงจากไฟล์ 50knotsreal.json แทน 

        const CATEGORIES = [
            { id: 'All', label: 'ทั้งหมด', icon: Icons.Book },
            { id: 'Basic', label: 'พื้นฐาน', icon: Icons.Anchor },
            { id: 'Camping', label: 'แคมป์', icon: Icons.Tent },
            { id: 'Boating', label: 'ทางน้ำ', icon: Icons.Fish },
            { id: 'Climbing', label: 'กู้ภัย', icon: Icons.Mountain },
            { id: 'Binding', label: 'ผูกมัด', icon: Icons.Package },
            { id: 'Decorative', label: 'อื่นๆ', icon: Icons.Zap },
        ];

        // --- COMPONENTS ---

        const HtmlLayout = ({ children }) => (
            <div className="min-h-screen bg-slate-200 flex justify-center p-0 md:p-6 pb-0 md:pb-6 font-sans">
                {/* Modern Device Container */}
                <div className="w-full md:w-[480px] lg:w-[800px] h-[100vh] md:h-[90vh] md:max-h-[900px] bg-slate-50 md:rounded-[2.5rem] md:shadow-2xl flex flex-col relative overflow-hidden md:ring-8 ring-white/60">
                    {children}
                </div>
            </div>
        );

        const TopMenu = ({ activeCategory, setActiveCategory, searchTerm, setSearchTerm, onToggleFavorites, onRefresh }) => (
            <div className="w-full bg-white flex flex-col z-20 sticky top-0 shadow-sm border-b border-slate-100 rounded-t-[2.5rem] md:rounded-t-none">
                {/* Header Row */}
                <div className="flex items-center justify-between p-4 pb-2">
                    <div className="flex items-center gap-2 text-indigo-600">
                        <div className="bg-indigo-100 p-2 rounded-xl">
                            <Icons.Globe width={20} height={20} strokeWidth={2.5} />
                        </div>
                        <div>
                            <h1 className="font-bold text-lg leading-none tracking-tight text-slate-800">KnotsApp</h1>
                            <span className="text-[10px] text-indigo-500 font-medium tracking-wide">คู่มือเงื่อนเชือก</span>
                        </div>
                    </div>

                    <div className="flex gap-2">
                        {/* Favorite Badge button */}
                        <button 
                            onClick={onToggleFavorites}
                            className="w-10 h-10 bg-pink-50 rounded-full flex items-center justify-center text-pink-500 hover:bg-pink-100 transition-colors active:scale-95"
                            title="รายการโปรด"
                        >
                            <Icons.Heart width={20} height={20} fill="currentColor" />
                        </button>
                        <button 
                            onClick={onRefresh}
                            className="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-200 transition-all active:scale-95 hover:rotate-180"
                            title="รีเฟรช"
                        >
                            <Icons.Refresh width={20} height={20} />
                        </button>
                    </div>
                </div>

                {/* Search Bar */}
                <div className="px-4 pb-3">
                    <div className="flex items-center bg-slate-100 rounded-2xl h-11 px-4 border border-transparent focus-within:border-indigo-300 focus-within:bg-white focus-within:shadow-[0_0_0_4px_rgba(99,102,241,0.1)] transition-all">
                        <Icons.Search width={18} height={18} className="text-slate-400 mr-2" />
                        <input 
                            type="text"
                            className="w-full bg-transparent outline-none text-sm text-slate-700 placeholder:text-slate-400"
                            placeholder="ค้นหาชื่อเงื่อน หรือ การใช้งาน..."
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                        />
                    </div>
                </div>

                {/* Categories Scroll */}
                <div className="px-4 pb-2 overflow-x-auto hide-scroll">
                    <div className="flex gap-1.5 min-w-max">
                        {CATEGORIES.map((cat) => (
                            <button
                                key={cat.id}
                                onClick={() => setActiveCategory(cat.id)}
                                className={`
                                    px-3 py-1.5 text-[11px] font-medium flex items-center gap-1.5 transition-all whitespace-nowrap rounded-lg
                                    ${activeCategory === cat.id 
                                        ? 'bg-slate-800 text-white shadow-sm' 
                                        : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 hover:border-slate-300'}
                                `}
                            >
                                {cat.label}
                            </button>
                        ))}
                    </div>
                </div>
            </div>
        );

        const BottomNavigation = ({ activeTab, onNavigate }) => (
            <div className="absolute bottom-0 left-0 w-full h-[60px] bg-white/95 backdrop-blur-md border-t border-slate-200 flex justify-around items-center z-30 pb-safe md:rounded-b-[2.5rem]">
                <button 
                    onClick={() => onNavigate('home')}
                    className={`flex flex-col items-center justify-center w-20 h-full gap-0.5 transition-colors ${activeTab === 'home' ? 'text-indigo-600' : 'text-slate-400 hover:text-slate-600'}`}
                >
                    <div className={`p-1 rounded-xl transition-all ${activeTab === 'home' ? 'bg-indigo-50' : ''}`}>
                        <Icons.Home width={20} height={20} strokeWidth={activeTab === 'home' ? 2.5 : 2} />
                    </div>
                    <span className="text-[9px] font-bold">หน้าแรก</span>
                </button>

                <button 
                    onClick={() => onNavigate('favorites')}
                    className={`flex flex-col items-center justify-center w-20 h-full gap-0.5 transition-colors ${activeTab === 'favorites' ? 'text-pink-500' : 'text-slate-400 hover:text-slate-600'}`}
                >
                    <div className={`p-1 rounded-xl transition-all ${activeTab === 'favorites' ? 'bg-pink-50' : ''}`}>
                        <Icons.Heart width={20} height={20} fill={activeTab === 'favorites' ? "currentColor" : "none"} strokeWidth={activeTab === 'favorites' ? 2.5 : 2} />
                    </div>
                    <span className="text-[9px] font-bold">รายการโปรด</span>
                </button>
            </div>
        );

        const DifficultyBadge = ({ level }) => {
            const config = {
                'Very Easy': { label: 'ง่ายมาก', bg: 'bg-emerald-100', text: 'text-emerald-700' },
                'ง่ายมาก': { label: 'ง่ายมาก', bg: 'bg-emerald-100', text: 'text-emerald-700' },
                'Easy': { label: 'ง่าย', bg: 'bg-sky-100', text: 'text-sky-700' },
                'ง่าย': { label: 'ง่าย', bg: 'bg-sky-100', text: 'text-sky-700' },
                'Medium': { label: 'ปานกลาง', bg: 'bg-amber-100', text: 'text-amber-700' },
                'ปานกลาง': { label: 'ปานกลาง', bg: 'bg-amber-100', text: 'text-amber-700' },
                'Hard': { label: 'ยาก', bg: 'bg-orange-100', text: 'text-orange-700' },
                'ยาก': { label: 'ยาก', bg: 'bg-orange-100', text: 'text-orange-700' },
                'Very Hard': { label: 'ยากมาก', bg: 'bg-rose-100', text: 'text-rose-700' },
                'ยากมาก': { label: 'ยากมาก', bg: 'bg-rose-100', text: 'text-rose-700' }
            };
            const { label, bg, text } = config[level] || { label: level || 'ทั่วไป', bg: 'bg-slate-100', text: 'text-slate-700' };

            return (
                <span className={`text-[10px] px-2 py-0.5 rounded-full font-medium shadow-sm backdrop-blur-md ${bg} ${text} inline-block`}>
                    {label}
                </span>
            );
        };

        const KnotEntry = ({ knot, onClick, isFavorite, onToggleFav }) => {
            // Safe fallback values to prevent crashes if JSON is missing data
            const safeName = knot?.name || "ไม่ระบุชื่อเงื่อน";
            const imageUrl = knot?.imageUrl || knot?.image || `https://placehold.co/400x400/EEE/31343C?text=${encodeURIComponent(safeName.split('(')[0])}`;
            
            return (
                <div 
                    className="relative bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-all duration-200 cursor-pointer border border-slate-100 flex flex-col h-full active:scale-[0.95]"
                    onClick={() => onClick(knot)}
                >
                    {/* Image Area - Square Aspect Ratio for Compact 3-Column Grid */}
                    <div className="relative aspect-square w-full overflow-hidden bg-slate-100 border-b border-slate-50">
                        <img 
                            src={imageUrl} 
                            alt={safeName} 
                            loading="lazy"
                            className="w-full h-full object-cover" 
                            onError={(e) => { e.target.onerror = null; e.target.src='https://placehold.co/400x400/f8fafc/94a3b8?text=No+Image'; }}
                        />
                        {/* Favorite Button overlaid on image */}
                        <button 
                            onClick={(e) => {
                                e.stopPropagation();
                                if(knot?.id) onToggleFav(knot.id);
                            }}
                            className={`absolute top-1.5 right-1.5 p-1.5 rounded-full shadow-sm transition-transform hover:scale-110 active:scale-90 z-10 ${isFavorite ? 'bg-white/90' : 'bg-black/30 hover:bg-white/90'}`}
                        >
                            <Icons.Heart width={14} height={14} fill={isFavorite ? "#ec4899" : "none"} className={isFavorite ? "text-pink-500" : "text-white"} />
                        </button>
                    </div>

                    {/* Content Area - Minimalist */}
                    <div className="p-2 flex-1 flex flex-col items-center justify-center text-center">
                        <h3 className="font-bold text-slate-800 text-[10px] sm:text-xs leading-tight line-clamp-2">
                            {safeName.split('(')[0].trim()}
                        </h3>
                    </div>
                </div>
            );
        };

        const HtmlDialog = ({ knot, onClose, isFavorite, onToggleFav }) => {
            if (!knot) return null;
            const [showVideo, setShowVideo] = useState(false);
            
            // Safe Data Fallbacks to prevent White Screen (Crash)
            const safeName = knot.name || "ไม่ระบุชื่อเงื่อน";
            const imageUrl = knot.imageUrl || knot.image || `https://placehold.co/600x400/EEE/31343C?text=${encodeURIComponent(safeName.split('(')[0])}`;
            
            // Handle parsing logic for youtubeUrl, youtubeId, or video to get ID
            let videoId = "V7_GzJp2j2U";
            const rawVideo = knot.youtubeUrl || knot.youtubeId || knot.video;
            if (rawVideo && typeof rawVideo === 'string') {
                if (rawVideo.includes("v=")) {
                    videoId = rawVideo.split("v=")[1].split("&")[0];
                } else if (rawVideo.includes("youtu.be/")) {
                    videoId = rawVideo.split("youtu.be/")[1].split("?")[0];
                } else if (rawVideo.length > 3 && rawVideo !== ',') {
                    videoId = rawVideo;
                }
            }
            
            // Ensure steps is an array to prevent .map() from crashing
            const stepsArray = Array.isArray(knot.steps) ? knot.steps : (typeof knot.steps === 'string' ? [{desc: knot.steps}] : []);

            return (
                <div className="fixed inset-0 z-50 flex items-end justify-center sm:items-center p-0 sm:p-4 bg-slate-900/40 backdrop-blur-sm animate-fadeIn">
                    <div className="bg-white w-full sm:max-w-md md:max-w-lg rounded-t-[2rem] sm:rounded-3xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden transform transition-all">
                        
                        {/* Header Image/Video Area */}
                        <div className="relative h-56 sm:h-64 bg-slate-100 flex-shrink-0">
                            {showVideo ? (
                                <iframe 
                                    className="w-full h-full"
                                    src={`https://www.youtube.com/embed/${videoId}?autoplay=1`}
                                    title="YouTube video player"
                                    frameBorder="0"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                    allowFullScreen
                                ></iframe>
                            ) : (
                                <img 
                                    src={imageUrl} 
                                    alt={safeName} 
                                    className="w-full h-full object-cover" 
                                    onError={(e) => { e.target.onerror = null; e.target.src='https://placehold.co/600x400/f8fafc/94a3b8?text=No+Image'; }}
                                />
                            )}
                            
                            {/* Close Button & Actions overlay */}
                            <div className="absolute top-4 left-4 right-4 flex justify-between items-start">
                                <button onClick={onClose} className="w-10 h-10 bg-white/80 backdrop-blur-md rounded-full flex items-center justify-center text-slate-700 hover:bg-white shadow-sm transition-transform active:scale-95">
                                    <Icons.ChevronLeft width={24} height={24} />
                                </button>
                                
                                <div className="flex gap-2 flex-col">
                                    <button 
                                        onClick={() => { if(knot.id) onToggleFav(knot.id); }}
                                        className={`w-10 h-10 rounded-full flex items-center justify-center shadow-sm backdrop-blur-md transition-transform active:scale-95 ${isFavorite ? 'bg-white text-pink-500' : 'bg-black/30 text-white hover:bg-white hover:text-pink-500'}`}
                                    >
                                        <Icons.Heart width={20} height={20} fill={isFavorite ? "currentColor" : "none"} />
                                    </button>
                                </div>
                            </div>
                            
                            {/* Toggle Media Button */}
                            <button 
                                onClick={() => setShowVideo(!showVideo)}
                                className="absolute bottom-4 right-4 flex items-center gap-2 px-4 py-2 bg-white/90 backdrop-blur-md rounded-full shadow-lg text-xs font-bold text-slate-800 hover:bg-white hover:scale-105 transition-all"
                            >
                                {showVideo ? (
                                    <span className="flex items-center gap-1"><Icons.Image width={16} height={16} className="text-indigo-600"/> ดูรูปภาพ</span>
                                ) : (
                                    <span className="flex items-center gap-1"><Icons.Play width={16} height={16} className="text-red-600" fill="currentColor" /> วิดีโอ</span>
                                )}
                            </button>
                        </div>

                        {/* Detail Content */}
                        <div className="p-6 overflow-y-auto custom-scrollbar flex-1 bg-white">
                            <div className="mb-4">
                                <DifficultyBadge level={knot.difficulty} />
                                <h2 className="text-xl sm:text-2xl font-bold text-slate-800 mt-2 mb-1 leading-tight">
                                    {safeName.split('(')[0]}
                                </h2>
                                <p className="text-sm text-slate-500 font-medium">
                                    {safeName.split('(')[1]?.replace(')', '') || 'Knot Details'}
                                </p>
                            </div>

                            <div className="bg-slate-50 rounded-2xl p-4 mb-6 border border-slate-100">
                                <div className="flex mb-2">
                                    <div className="w-20 font-semibold text-slate-500 text-xs">หมวดหมู่</div>
                                    <div className="flex-1 text-sm text-slate-800 font-medium">{knot.category || "ไม่ระบุ"}</div>
                                </div>
                                <div className="flex">
                                    <div className="w-20 font-semibold text-slate-500 text-xs mt-0.5">การใช้งาน</div>
                                    <div className="flex-1 text-sm text-slate-700 leading-relaxed">{knot.usage || "ไม่มีข้อมูลอธิบาย"}</div>
                                </div>
                            </div>

                            <div>
                                <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                                    <span className="w-1.5 h-4 bg-indigo-500 rounded-full inline-block"></span>
                                    ขั้นตอนวิธีทำ (Steps)
                                </h3>
                                <div className="space-y-4">
                                    {stepsArray.map((step, idx) => {
                                        // Handle both old string format and new object format
                                        const isObject = typeof step === 'object' && step !== null;
                                        const title = isObject ? step.title : null;
                                        const desc = isObject ? step.desc : step;
                                        const image = isObject ? step.image : null;
                                        
                                        return (
                                            <div key={idx} className="flex gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                                <div className="flex-shrink-0 w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-xs font-bold mt-0.5">
                                                    {idx + 1}
                                                </div>
                                                <div className="flex-1">
                                                    {title && <h4 className="font-bold text-slate-800 text-sm mb-1">{title}</h4>}
                                                    <p className="text-sm text-slate-700 leading-relaxed">
                                                        {desc}
                                                    </p>
                                                    {image && (
                                                        <div className="mt-3 rounded-lg overflow-hidden border border-slate-200 bg-white">
                                                            <img src={image} alt={title || `ขั้นตอนที่ ${idx + 1}`} className="w-full h-auto object-contain max-h-48" loading="lazy" />
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                    {stepsArray.length === 0 && (
                                        <div className="text-center py-4 text-slate-400 text-sm">ไม่มีข้อมูลขั้นตอนสำหรับเงื่อนนี้</div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const FavoritesDialog = ({ favorites, allKnots, onClose, onToggleFav, onSelectKnot }) => {
            const favKnots = allKnots.filter(k => k && k.id && (favorites || []).includes(k.id));

            return (
                <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/40 backdrop-blur-sm animate-fadeIn">
                    <div className="bg-white w-full sm:max-w-md h-[85vh] sm:h-[80vh] rounded-t-[2.5rem] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden">
                        {/* Header */}
                        <div className="bg-white p-5 border-b border-slate-100 flex justify-between items-center z-10 sticky top-0">
                            <div>
                                <h2 className="font-bold text-xl text-slate-800 flex items-center gap-2">
                                    รายการโปรด
                                </h2>
                                <p className="text-xs text-slate-500 font-medium mt-1">บันทึกแล้ว {favKnots.length} รายการ</p>
                            </div>
                            <button onClick={onClose} className="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-200 transition-colors">
                                <Icons.ChevronLeft width={20} height={20} className="-rotate-90 sm:rotate-0" />
                            </button>
                        </div>

                        {/* Content */}
                        <div className="flex-1 overflow-y-auto p-4 custom-scrollbar bg-slate-50">
                            {favKnots.length > 0 ? (
                                <div className="space-y-3">
                                    {favKnots.map(knot => {
                                        const safeName = knot.name || "ไม่ระบุชื่อ";
                                        return (
                                            <div 
                                                key={knot.id} 
                                                onClick={() => onSelectKnot(knot)} 
                                                className="flex items-center gap-3 bg-white p-3 rounded-2xl cursor-pointer hover:shadow-md transition-all border border-slate-100 active:scale-[0.98]"
                                            >
                                                <div className="w-16 h-16 rounded-xl bg-slate-100 overflow-hidden flex-shrink-0">
                                                    <img 
                                                        src={knot.imageUrl || knot.image || `https://placehold.co/100x100/EEE/31343C?text=Knot`} 
                                                        className="w-full h-full object-cover" 
                                                        alt="knot"
                                                        onError={(e) => { e.target.onerror = null; e.target.src='https://placehold.co/100x100/f8fafc/94a3b8?text=No+Image'; }}
                                                    />
                                                </div>
                                                <div className="flex-1 overflow-hidden">
                                                    <div className="font-bold text-sm text-slate-800 truncate">{safeName.split('(')[0]}</div>
                                                    <div className="text-xs text-slate-500 mt-0.5">{knot.category || "-"}</div>
                                                </div>
                                                <button 
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        onToggleFav(knot.id);
                                                    }}
                                                    className="p-3 text-pink-500 hover:bg-pink-50 rounded-full transition-colors"
                                                >
                                                    <Icons.Heart width={20} height={20} fill="currentColor" />
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>
                            ) : (
                                <div className="h-full flex flex-col items-center justify-center text-slate-400 space-y-4 px-6 text-center">
                                    <div className="w-20 h-20 bg-pink-50 rounded-full flex items-center justify-center text-pink-300">
                                        <Icons.Heart width={40} height={40} />
                                    </div>
                                    <div>
                                        <p className="font-bold text-slate-600 text-base mb-1">ยังไม่มีรายการที่บันทึกไว้</p>
                                        <p className="text-xs text-slate-500 leading-relaxed">กดที่ไอคอนรูปหัวใจในการ์ดเงื่อน<br/>เพื่อเพิ่มรายการโปรดของคุณ</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [knotsData, setKnotsData] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [error, setError] = useState(null);

            const [searchTerm, setSearchTerm] = useState("");
            const [activeCategory, setActiveCategory] = useState("All");
            const [selectedKnot, setSelectedKnot] = useState(null);
            const [showFavorites, setShowFavorites] = useState(false);
            
            // Local Storage Logic
            const [favorites, setFavorites] = useState(() => {
                try {
                    const saved = localStorage.getItem('knots_favorites');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });

            useEffect(() => {
                localStorage.setItem('knots_favorites', JSON.stringify(favorites));
            }, [favorites]);

            // Fetch data from 50knotsreal.json
            useEffect(() => {
                fetch('50knotsreal.json')
                    .then(res => {
                        if (!res.ok) throw new Error('ไม่สามารถโหลดข้อมูลได้ (Network response was not ok)');
                        return res.json();
                    })
                    .then(data => {
                        // Validate data format slightly before applying
                        setKnotsData(Array.isArray(data) ? data : []);
                        setIsLoading(false);
                    })
                    .catch(err => {
                        console.error('Error loading knots data:', err);
                        setError(err.message);
                        setIsLoading(false);
                    });
            }, []);

            const toggleFavorite = (id) => {
                setFavorites(prev => 
                    prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
                );
            };

            const handleRefresh = () => {
                setSearchTerm("");
                setActiveCategory("All");
            };

            const filteredKnots = useMemo(() => {
                if (!Array.isArray(knotsData)) return [];
                
                return knotsData.filter(knot => {
                    if (!knot) return false; // skip null entries
                    
                    const lowerSearch = searchTerm.toLowerCase();
                    const safeName = knot.name || "";
                    const safeUsage = knot.usage || "";
                    
                    const lowerName = safeName.toLowerCase();
                    const matchesSearch = lowerName.includes(lowerSearch) || safeUsage.toLowerCase().includes(lowerSearch);
                    
                    const categoryMatch = activeCategory === "All" 
                        ? true 
                        : activeCategory === "Decorative" 
                            ? (knot.category === "Decorative" || knot.category === "General")
                            : knot.category === activeCategory;
                    
                    return matchesSearch && categoryMatch;
                });
            }, [searchTerm, activeCategory, knotsData]);

            return (
                <HtmlLayout>
                    <TopMenu 
                        activeCategory={activeCategory} 
                        setActiveCategory={setActiveCategory}
                        searchTerm={searchTerm}
                        setSearchTerm={setSearchTerm}
                        onToggleFavorites={() => setShowFavorites(true)}
                        onRefresh={handleRefresh}
                    />
                    
                    <main className="flex-1 overflow-y-auto p-3 md:p-6 custom-scrollbar bg-slate-50/50 pb-20 relative">
                        <div className="relative z-10 max-w-4xl mx-auto">
                            <div className="mb-3 flex justify-between items-center text-slate-500 px-1">
                                <span className="text-[10px] sm:text-xs font-semibold">พบ {filteredKnots.length} รายการ</span>
                            </div>

                            {isLoading ? (
                                <div className="py-20 flex flex-col items-center justify-center text-center">
                                    <div className="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
                                    <p className="font-bold text-slate-700">กำลังโหลดข้อมูล 50knotsreal.json...</p>
                                </div>
                            ) : error ? (
                                <div className="py-20 flex flex-col items-center justify-center text-center">
                                    <div className="bg-red-100 p-4 rounded-full mb-4 text-red-500">
                                        <Icons.Info width={40} height={40} />
                                    </div>
                                    <p className="font-bold text-red-600 text-lg mb-2">เกิดข้อผิดพลาด</p>
                                    <p className="text-sm text-slate-500">{error}</p>
                                    <p className="text-xs text-slate-400 mt-2">คำแนะนำ: โปรดตรวจสอบว่าไฟล์ 50knotsreal.json อยู่ในโฟลเดอร์เดียวกับเว็บนี้</p>
                                </div>
                            ) : filteredKnots.length > 0 ? (
                                <div className="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-5 gap-2 md:gap-4">
                                    {filteredKnots.map((knot, index) => (
                                        <KnotEntry 
                                            // Fallback key just in case id is missing
                                            key={knot?.id || `knot-index-${index}`} 
                                            knot={knot} 
                                            onClick={setSelectedKnot} 
                                            isFavorite={favorites.includes(knot?.id)}
                                            onToggleFav={toggleFavorite}
                                        />
                                    ))}
                                </div>
                            ) : (
                                <div className="py-20 flex flex-col items-center justify-center text-center">
                                    <div className="bg-slate-100 p-6 rounded-full mb-4 text-slate-400">
                                        <Icons.Search width={48} height={48} />
                                    </div>
                                    <p className="font-bold text-slate-700 text-lg mb-2">ไม่พบรายการที่ค้นหา</p>
                                    <p className="text-sm text-slate-500 mb-6">ลองเปลี่ยนคำค้นหา หรือเลือกหมวดหมู่ใหม่ดูนะ</p>
                                    <button 
                                        onClick={handleRefresh} 
                                        className="px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-medium shadow-md shadow-indigo-200 hover:bg-indigo-700 active:scale-95 transition-all"
                                    >
                                        ล้างการค้นหา
                                    </button>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Bottom Navigation */}
                    <BottomNavigation 
                        activeTab={showFavorites ? 'favorites' : 'home'}
                        onNavigate={(tab) => {
                            if (tab === 'home') {
                                setShowFavorites(false);
                                handleRefresh(); 
                            } else if (tab === 'favorites') {
                                setShowFavorites(true);
                            }
                        }}
                    />

                    {/* Dialogs */}
                    {selectedKnot && (
                        <HtmlDialog 
                            knot={selectedKnot} 
                            onClose={() => setSelectedKnot(null)} 
                            isFavorite={favorites.includes(selectedKnot.id)}
                            onToggleFav={toggleFavorite}
                        />
                    )}

                    {showFavorites && (
                        <FavoritesDialog 
                            favorites={favorites}
                            allKnots={knotsData}
                            onClose={() => setShowFavorites(false)}
                            onToggleFav={toggleFavorite}
                            onSelectKnot={(knot) => {
                                setSelectedKnot(knot);
                                setShowFavorites(false);
                            }}
                        />
                    )}
                </HtmlLayout>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
