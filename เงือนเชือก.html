                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                                <button className="bg-black text-white px-3 flex items-center justify-center border-2 border-black border-l-0 hover:bg-gray-800 h-7">
                                    <Icons.Search width={12} height={12} />
                                </button>
                            </div>
                        </div>
                        
                        <div className="hidden md:flex border border-black p-1 bg-white text-[10px] ml-auto gap-4 whitespace-nowrap h-7 items-center">
                           <span>STATUS: ONLINE</span>
                           <span>SERVER: READY</span>
                        </div>
                    </div>
                </div>

                {/* Row 2: Categories */}
                <div className="bg-white border-t-2 border-black md:border-t-2 overflow-x-auto custom-scrollbar">
                    <div className="flex p-1.5 gap-1.5 min-w-max">
                        <span className="text-[10px] font-bold uppercase py-1 self-center mr-1">[DIR]:</span>
                        {CATEGORIES.map((cat) => (
                            <button
                                key={cat.id}
                                onClick={() => setActiveCategory(cat.id)}
                                className={`
                                    px-2 py-0.5 text-[11px] border border-black flex items-center gap-1.5 transition-all shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:translate-x-[1px] active:translate-y-[1px] active:shadow-none whitespace-nowrap
                                    ${activeCategory === cat.id
                                        ? 'bg-blue-700 text-white font-bold hover:text-white'
                                        : 'bg-white text-blue-700 hover:bg-blue-50'}
                                `}
                            >
                                {activeCategory === cat.id ? '▶' : ''} {cat.label}
                            </button>
                        ))}
                    </div>
                </div>
            </div>
        );

        const DifficultyBadge = ({ level }) => {
            const thaiLevel = {
                'Very Easy': 'ง่ายมาก',
                'Easy': 'ง่าย',
                'Medium': 'ปานกลาง',
                'Hard': 'ยาก',
                'Very Hard': 'ยากมาก'
            }[level] || level;

            return (
                <span className="text-[10px] uppercase border border-black px-1 bg-gray-200 text-black">
                    [{thaiLevel}]
                </span>
            );
        };

        const KnotEntry = ({ knot, onClick }) => (
            <div 
                onClick={() => onClick(knot)}
                className="border border-black p-3 cursor-pointer hover:bg-yellow-50 hover:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all active:translate-x-[1px] active:translate-y-[1px] active:shadow-none bg-white h-full flex flex-col"
            >
                <div className="flex justify-between items-start mb-2 border-b border-black border-dotted pb-2">
                    <span className="font-bold text-blue-700 underline text-sm line-clamp-1 mr-2">
                        #{knot.id} {knot.name.split('(')[0]}
                    </span>
                    <DifficultyBadge level={knot.difficulty} />
                </div>

                <div className="text-xs space-y-2 flex-1">
                    <p className="font-bold truncate">{knot.name.split('(')[1]?.replace(')', '') || 'N/A'}</p>
                    <p className="text-gray-600 line-clamp-2">
                        <span className="text-black font-bold">&gt; USE:</span> {knot.usage}
                    </p>
                </div>
            </div>
        );

        const HtmlDialog = ({ knot, onClose }) => {
            if (!knot) return null;
            const [showVideo, setShowVideo] = useState(false);
            
            // Fallback content
            const imageUrl = knot.imageUrl || `https://placehold.co/600x400/EEE/31343C?font=roboto&text=${encodeURIComponent(knot.name.split('(')[0])}`;
            const videoId = knot.youtubeId || "V7_GzJp2j2U"; // Default video

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-white/80 backdrop-grayscale">
                    <div className="bg-white w-full max-w-md border-2 border-black shadow-[10px_10px_0px_0px_rgba(0,0,0,1)] flex flex-col max-h-[90vh]">
                        
                        <div className="bg-blue-700 text-white p-2 flex justify-between items-center border-b-2 border-black flex-shrink-0">
                           <span className="font-bold text-sm flex items-center gap-2">
                             <Icons.Info width={14} height={14} /> properties_view.exe
                           </span>
                           <button onClick={onClose} className="bg-gray-300 text-black px-2 border border-white border-b-black border-r-black active:border-t-black active:border-l-black hover:bg-red-600 hover:text-white font-bold text-xs">
                             X
                           </button>
                        </div>

                        <div className="p-4 overflow-y-auto font-mono text-sm custom-scrollbar">
                           <h2 className="text-xl font-bold border-b-4 border-black mb-4 pb-2 text-center">
                             {knot.name}
                           </h2>

                           <div className="mb-4 border-2 border-black bg-black">
                              {showVideo ? (
                                <div className="relative pt-[56.25%] w-full">
                                  <iframe 
                                    className="absolute inset-0 w-full h-full"
                                    src={`https://www.youtube.com/embed/${videoId}?autoplay=1`}
                                    title="YouTube video player"
                                    frameBorder="0"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                    allowFullScreen
                                  ></iframe>
                                </div>
                              ) : (
                                <div className="relative group bg-gray-100 flex items-center justify-center min-h-[200px]">
                                  <img 
                                    src={imageUrl} 
                                    alt={knot.name} 
                                    className="w-full h-auto object-cover block max-h-[250px]" 
                                    onError={(e) => {
                                        e.target.onerror = null; 
                                        e.target.src='https://placehold.co/600x400/EEE/31343C?font=roboto&text=Image+Not+Found'
                                    }}
                                  />
                                </div>
                              )}
                           </div>

                           <div className="flex gap-2 mb-6 justify-center">
                              {!showVideo ? (
                                <button 
                                  onClick={() => setShowVideo(true)}
                                  className="flex items-center gap-2 px-4 py-2 bg-red-600 text-white font-bold border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-none transition-all active:translate-x-[2px] active:translate-y-[2px]"
                                >
                                  <Icons.Play width={14} height={14} fill="currentColor" /> ดูวิดีโอสาธิต
                                </button>
                              ) : (
                                <button 
                                  onClick={() => setShowVideo(false)}
                                  className="flex items-center gap-2 px-4 py-2 bg-gray-200 text-black font-bold border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-none transition-all active:translate-x-[2px] active:translate-y-[2px]"
                                >
                                  <Icons.Image width={14} height={14} /> กลับไปดูรูปภาพ
                                </button>
                              )}
                           </div>
                           
                           <table className="w-full border-2 border-black mb-6 text-xs">
                             <tbody>
                               <tr className="border-b border-black">
                                 <td className="bg-gray-200 p-2 border-r border-black w-1/3 font-bold">หมวดหมู่</td>
                                 <td className="p-2">{knot.category}</td>
                               </tr>
                               <tr className="border-b border-black">
                                 <td className="bg-gray-200 p-2 border-r border-black font-bold">ความยาก</td>
                                 <td className="p-2">{knot.difficulty}</td>
                               </tr>
                               <tr>
                                 <td className="bg-gray-200 p-2 border-r border-black font-bold">การใช้งาน</td>
                                 <td className="p-2">{knot.usage}</td>
                               </tr>
                             </tbody>
                           </table>

                           <fieldset className="border-2 border-black p-4 mb-4">
                             <legend className="px-2 font-bold bg-white border border-black ml-2 text-xs">ขั้นตอน (STEPS)</legend>
                             <ol className="list-decimal list-inside space-y-2">
                               {knot.steps.map((step, idx) => (
                                 <li key={idx} className="pl-2">
                                   {step}
                                 </li>
                               ))}
                             </ol>
                           </fieldset>
                        </div>

                        <div className="p-2 border-t-2 border-black bg-gray-100 flex justify-end flex-shrink-0">
                           <button onClick={onClose} className="px-6 py-1 bg-gray-200 border-2 border-white border-b-black border-r-black active:border-t-black active:border-l-black active:bg-gray-300 text-sm font-bold hover:bg-red-500 hover:text-white transition-colors">
                             ปิด (CLOSE)
                           </button>
                        </div>
                    </div>
                </div>
            );
        };

        const PageContent = ({ children, title, subtitle }) => (
            <main className="flex-1 flex flex-col h-full bg-white overflow-hidden relative">
                <header className="p-2 md:p-3 border-b-2 border-black flex justify-between items-center bg-gray-50">
                    <div>
                        <h2 className="text-lg md:text-xl font-bold uppercase font-sans tracking-tighter">{title}</h2>
                        <p className="text-[10px] md:text-xs text-gray-500 font-mono">path: /root/{subtitle}</p>
                    </div>
                    <div className="hidden md:block text-xs border border-black px-2 py-1 bg-white">
                        {new Date().toLocaleDateString()}
                    </div>
                </header>
                
                <div className="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar bg-[url('https://www.transparenttextures.com/patterns/graphy.png')]">
                    {children}
                </div>
            </main>
        );

        function App() {
            const [searchTerm, setSearchTerm] = useState("");
            const [activeCategory, setActiveCategory] = useState("All");
            const [selectedKnot, setSelectedKnot] = useState(null);

            const filteredKnots = useMemo(() => {
                return KNOTS_DATA.filter(knot => {
                    const lowerSearch = searchTerm.toLowerCase();
                    const lowerName = knot.name.toLowerCase();
                    const matchesSearch = lowerName.includes(lowerSearch) || knot.usage.toLowerCase().includes(lowerSearch);
                    
                    const categoryMatch = activeCategory === "All" 
                        ? true 
                        : activeCategory === "Decorative" 
                            ? (knot.category === "Decorative" || knot.category === "General")
                            : knot.category === activeCategory;
                    
                    return matchesSearch && categoryMatch;
                });
            }, [searchTerm, activeCategory]);

            return (
                <HtmlLayout>
                    <TopMenu 
                        activeCategory={activeCategory} 
                        setActiveCategory={setActiveCategory}
                        searchTerm={searchTerm}
                        setSearchTerm={setSearchTerm}
                    />
                    
                    <PageContent 
                        title={activeCategory === 'All' ? 'Index' : activeCategory} 
                        subtitle={activeCategory === 'All' ? 'all_items' : 'filtered'}
                    >
                        <div className="w-full">
                            <div className="mb-4 text-xs font-bold border-b-2 border-black pb-1 flex justify-between">
                                <span>QUERY_RESULTS: {filteredKnots.length} ITEM(S)</span>
                                <span>[VIEW: GRID]</span>
                            </div>

                            {filteredKnots.length > 0 ? (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                                    {filteredKnots.map((knot) => (
                                        <KnotEntry key={knot.id} knot={knot} onClick={setSelectedKnot} />
                                    ))}
                                </div>
                            ) : (
                                <div className="p-8 border-2 border-black border-dashed text-center bg-gray-50">
                                    <p className="font-bold text-red-600 mb-2">ERROR 404: KNOT NOT FOUND</p>
                                    <p className="text-xs">Please refine your search parameters.</p>
                                </div>
                            )}
                        </div>
                    </PageContent>

                    {selectedKnot && (
                        <HtmlDialog knot={selectedKnot} onClose={() => setSelectedKnot(null)} />
                    )}
                </HtmlLayout>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
