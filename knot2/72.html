<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วิธีผูกเงื่อน Grog Sling - สไลเดอร์สอน</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- ตั้งค่าฟอนต์ภาษาไทย -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f8fafc;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .image-placeholder {
            background: #ffffff;
        }
        .user-select-none {
            user-select: none;
            -webkit-user-drag: none;
        }
        .slide-transition {
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .knot-img {
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.08));
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- คอนเทนเนอร์หลัก -->
    <div class="w-full max-w-xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden relative border border-gray-100">
        
        <!-- ส่วนหัว -->
        <div class="bg-indigo-900 text-white p-6 text-center shadow-md relative z-10">
            <h1 class="text-2xl font-bold tracking-wide">วิธีผูกเงื่อน Grog Sling</h1>
            <p class="text-indigo-200 text-sm mt-1 opacity-90">คู่มือการผูกเงื่อนสลิงแบบละเอียด 22 ขั้นตอน</p>
        </div>

        <!-- พื้นที่สไลเดอร์ -->
        <div id="slider-container" class="relative overflow-hidden w-full touch-pan-y">
            <!-- แทร็กสไลเดอร์ -->
            <div id="slider-track" class="flex slide-transition w-full cursor-grab active:cursor-grabbing">
                <!-- สไลด์จะถูกสร้างด้วย JavaScript -->
            </div>
        </div>

        <!-- ปุ่มควบคุม -->
        <button id="prevBtn" class="absolute top-[40%] left-3 -translate-y-1/2 bg-white/95 backdrop-blur text-slate-800 p-3 rounded-full shadow-lg hover:bg-white hover:scale-110 transition-all disabled:opacity-0 z-20 focus:outline-none border border-slate-100">
            <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <button id="nextBtn" class="absolute top-[40%] right-3 -translate-y-1/2 bg-white/95 backdrop-blur text-slate-800 p-3 rounded-full shadow-lg hover:bg-white hover:scale-110 transition-all disabled:opacity-0 z-20 focus:outline-none border border-slate-100">
            <i data-lucide="chevron-right" class="w-6 h-6"></i>
        </button>

        <!-- จุด Indicators -->
        <div class="flex justify-center flex-wrap gap-1.5 px-4 pb-6 pt-2 bg-white" id="dots-container"></div>
        
        <!-- ข้อมูลสรุปด้านล่าง -->
        <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 text-center">
            <p class="text-xs text-gray-400">เลื่อนนิ้วหรือใช้ปุ่มลูกศรเพื่อดูขั้นตอนถัดไป</p>
        </div>
    </div>

    <script>
        // ข้อมูลสไลด์สำหรับ Grog Sling (R1 - R22)
        const baseUrl = "https://www.animatedknots.com/photos/grogsling/grogslingR";
        
        const descriptions = [
            "เตรียมเชือกสองเส้นวางขนานกัน",
            "เริ่มทำบ่วงแรกโดยวางทับเชือกอีกเส้น",
            "สอดปลายเชือกเข้าใต้เส้นหลัก",
            "ดึงบ่วงให้เกิดลักษณะห่วงคล้อง",
            "เริ่มจัดการเส้นที่สองเพื่อทำความแข็งแรง",
            "สอดปลายเชือกย้อนกลับขึ้นด้านบน",
            "นำปลายเชือกอ้อมใต้จุดตัดแรก",
            "ดึงปลายเชือกผ่านห่วงที่สร้างไว้",
            "เริ่มจัดโครงสร้างของเงื่อนสลิง",
            "จัดตำแหน่งเชือกให้พร้อมสำหรับการสอดซ้ำ",
            "สอดปลายเชือกเข้าในช่องว่างกึ่งกลาง",
            "ดึงปลายให้พ้นจากห่วงด้านล่าง",
            "เตรียมการล็อคส่วนที่สามของเงื่อน",
            "พาดเชือกอ้อมเพื่อทำจุดยึด",
            "สอดปลายย้อนกลับเข้าในจุดหมุน",
            "ตรวจสอบความเรียบร้อยของเส้นเชือก",
            "เริ่มดึงแต่ละส่วนให้เริ่มกระชับ",
            "จัดตำแหน่งรอยหยักของเงื่อนให้เสมอกัน",
            "เช็คจุดรับแรงกระแทกของสลิง",
            "ดึงเส้นหลักทั้งสองข้างพร้อมกัน",
            "ตรวจสอบความปลอดภัยและจุดรัด",
            "เสร็จสมบูรณ์: เงื่อน Grog Sling พร้อมใช้งาน"
        ];

        const slidesData = Array.from({ length: 22 }, (_, i) => ({
            img: `${baseUrl}${i + 1}.jpg`,
            title: `ขั้นตอนที่ ${i + 1}`,
            desc: descriptions[i] || "ทำตามภาพประกอบเพื่อจัดรูปทรงของเงื่อน"
        }));

        const track = document.getElementById('slider-track');
        const dotsContainer = document.getElementById('dots-container');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        let currentIndex = 0;

        // ฟังก์ชันสร้างสไลด์
        function createSlides() {
            slidesData.forEach((slide, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'w-full flex-shrink-0 flex flex-col slide-item';
                
                const isLast = index === slidesData.length - 1;
                const accentColor = isLast ? 'border-emerald-500' : 'border-indigo-900';
                const textColor = isLast ? 'text-emerald-600' : 'text-indigo-900';
                const badgeColor = isLast ? 'bg-emerald-600' : 'bg-indigo-900';

                slideDiv.innerHTML = `
                    <div class="h-72 sm:h-96 image-placeholder w-full flex items-center justify-center border-b-4 ${accentColor} relative overflow-hidden bg-white">
                        <div class="absolute top-4 right-4 text-white text-xs font-bold px-3 py-1 rounded-full z-10 shadow ${badgeColor}">${index + 1} / ${slidesData.length}</div>
                        <img id="Knot-${index}" class="knot-img user-select-none w-full h-full object-contain p-4 transition-transform duration-500" 
                             src="${slide.img}" 
                             alt="${slide.title}"
                             title="${slide.title}">
                    </div>
                    <div class="p-6 text-center bg-white min-h-[140px] flex flex-col justify-center">
                        <h2 class="text-xl font-bold mb-2 ${textColor}">${slide.title}</h2>
                        <p class="text-gray-600 leading-relaxed text-sm sm:text-base px-2">${slide.desc}</p>
                    </div>
                `;
                track.appendChild(slideDiv);

                // สร้างจุด Indicator
                const dot = document.createElement('div');
                dot.className = `dot h-1.5 rounded-full transition-all duration-300 cursor-pointer ${index === 0 ? 'bg-indigo-900 w-6' : 'bg-gray-200 w-1.5'}`;
                dot.addEventListener('click', () => {
                    currentIndex = index;
                    updateSlider();
                });
                dotsContainer.appendChild(dot);
            });
        }

        function updateSlider() {
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slidesData.length - 1;

            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                if (i === currentIndex) {
                    dot.classList.add('bg-indigo-900', 'w-6');
                    dot.classList.remove('bg-gray-200', 'w-1.5');
                } else {
                    dot.classList.remove('bg-indigo-900', 'w-6');
                    dot.classList.add('bg-gray-200', 'w-1.5');
                }
            });
        }

        nextBtn.addEventListener('click', () => {
            if (currentIndex < slidesData.length - 1) {
                currentIndex++;
                updateSlider();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlider();
            }
        });

        // รองรับการปัด (Swipe)
        let startX = 0;
        let isDragging = false;

        track.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
            track.style.transition = 'none';
        }, {passive: true});

        track.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const x = e.touches[0].clientX;
            const walk = startX - x;
            track.style.transform = `translateX(calc(-${currentIndex * 100}% - ${walk}px))`;
        }, {passive: true});

        track.addEventListener('touchend', (e) => {
            isDragging = false;
            track.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
            const endX = e.changedTouches[0].clientX;
            const diff = startX - endX;
            if (Math.abs(diff) > 50) {
                if (diff > 0 && currentIndex < slidesData.length - 1) currentIndex++;
                else if (diff < 0 && currentIndex > 0) currentIndex--;
            }
            updateSlider();
        });

        // รองรับคีย์บอร์ด
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextBtn.click();
            if (e.key === 'ArrowLeft') prevBtn.click();
        });

        // เริ่มต้นสร้างสไลด์และตั้งค่า
        createSlides();
        updateSlider();
        lucide.createIcons();
        window.addEventListener('resize', updateSlider);
    </script>
</body>
</html>
