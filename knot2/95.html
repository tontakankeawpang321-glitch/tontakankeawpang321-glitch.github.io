<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วิธีถักเชือก Long Bury Splice - คู่มือทีละขั้นตอน</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- ตั้งค่าฟอนต์ภาษาไทย -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f1f5f9; /* พื้นหลังสีเทาอ่อน โทน nautical */
        }
        .slide-transition {
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .knot-img {
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            max-width: 100%;
            height: auto;
        }
        .user-select-none {
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- คอนเทนเนอร์หลัก -->
    <div class="w-full max-w-xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden relative border border-slate-300">
        
        <!-- ส่วนหัว -->
        <div class="bg-slate-800 text-white p-6 text-center shadow-md relative z-10">
            <h1 class="text-2xl font-bold tracking-wide">Long Bury Splice</h1>
            <h2 class="text-lg font-medium mt-1 text-slate-300">(การทำห่วงเชือกถักเกลียวเดี่ยว)</h2>
            <p class="text-slate-200 text-sm mt-2 opacity-90">วิธีถักสอดซ่อนปลายเชือกสำหรับเชือกแกนกลวง (เช่น Dyneema/Spectra) ช่วยรักษารับความแข็งแรงของเชือกได้สูงสุดและสวยงาม</p>
        </div>

        <!-- พื้นที่สไลเดอร์ -->
        <div id="slider-container" class="relative overflow-hidden w-full touch-pan-y">
            <!-- แทร็กสไลเดอร์ -->
            <div id="slider-track" class="flex slide-transition w-full cursor-grab active:cursor-grabbing">
                <!-- สไลด์จะถูกสร้างด้วย JavaScript -->
            </div>
        </div>

        <!-- ปุ่มควบคุม -->
        <button id="prevBtn" class="absolute top-[45%] left-3 -translate-y-1/2 bg-white/95 backdrop-blur text-slate-800 p-3 rounded-full shadow-lg hover:bg-white hover:scale-110 transition-all disabled:opacity-30 z-20 focus:outline-none border border-slate-100">
            <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <button id="nextBtn" class="absolute top-[45%] right-3 -translate-y-1/2 bg-white/95 backdrop-blur text-slate-800 p-3 rounded-full shadow-lg hover:bg-white hover:scale-110 transition-all disabled:opacity-30 z-20 focus:outline-none border border-slate-100">
            <i data-lucide="chevron-right" class="w-6 h-6"></i>
        </button>

        <!-- จุด Indicators -->
        <div class="flex justify-center flex-wrap gap-1.5 px-4 pb-6 pt-2 bg-white" id="dots-container"></div>
        
        <!-- ข้อมูลสรุปด้านล่าง -->
        <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 text-center flex flex-col items-center">
            <p class="text-xs text-slate-500 font-medium italic">ที่มาของภาพ: Animated Knots (Long Bury Splice)</p>
        </div>
    </div>

    <script>
        // ข้อมูลสไลด์สำหรับ Long Bury Splice
        const baseUrl = "https://www.animatedknots.com/photos/longbury/longburyR";
        
        // คำอธิบายขั้นตอน 17 ขั้นตอน ของการทำ Long Bury Splice
        const descriptions = [
            "เตรียมเชือก ทำเครื่องหมาย (Mark) จุดที่ 1 และวัดระยะห่างเพื่อทำจุดที่ 2 สำหรับกำหนดความยาวของปลายเชือกที่จะใช้สอดซ่อน",
            "ทำเครื่องหมายจุดที่ 3 โดยวัดระยะจากจุดที่ 2 ตามขนาดของห่วง (Eye) ที่คุณต้องการสร้าง",
            "เริ่มขั้นตอนการทำปลายเชือกให้เรียว (Taper) โดยคลายเกลียวและดึงเส้นใยบางส่วนออกมาจากปลายเชือก",
            "ตัดเส้นใยที่ดึงออกมาทิ้งไป โดยตัดลดหลั่นกันไปเพื่อให้ปลายเชือกค่อยๆ มีขนาดเล็กลง",
            "ดึงหรือรีดปลายเชือกให้ตึง เพื่อให้เส้นใยที่เหลือจัดเรียงตัวกัน ปลายเชือกจะดูเรียวเล็กลงอย่างชัดเจน",
            "เตรียมเครื่องมือสอดเชือก (Fid หรือ Wire Splicing Tool) เพื่อใช้ในการร้อยปลายเชือกกลับเข้าไปในแกนกลาง",
            "แทงเครื่องมือ (Fid) ทะลุเข้าไปในแกนกลางอันกลวงเปล่าของเชือก ตรงบริเวณจุด Mark 3 ที่ทำไว้",
            "ค่อยๆ ดันเครื่องมือร้อยเข้าไปด้านในแกนกลางของเชือกหลัก (Standing part) ไปทางจุด Mark 2",
            "ดันเครื่องมือต่อไปเรื่อยๆ ผ่านแกนกลางของเชือก ให้เชือกหลักย่นรวมกันอยู่บนแกนของเครื่องมือ",
            "ให้ปลายของเครื่องมือทะลุออกมาจากแกนกลางของเชือก ตรงบริเวณจุด Mark 2 พอดี",
            "นำปลายเชือกส่วนที่ทำเรียวไว้ (Tapered tail) มาสอดเข้ากับห่วงหรือที่หนีบของเครื่องมือถักเชือก",
            "ค่อยๆ ดึงเครื่องมือกลับ เพื่อลากปลายเชือกที่เรียวเข้าไปซ่อนในแกนกลางของเชือกหลัก",
            "ดึงผ่านเข้าไปอย่างระมัดระวัง รักษารูปทรงห่วงและให้ปลายเชือกร้อยผ่านแกนกลางไปเรื่อยๆ",
            "ดึงเครื่องมือและปลายเชือกทะลุออกมาทางจุด Mark 3 จนปลายเชือกโผล่ออกมาทั้งหมด",
            "ปลดเครื่องมือถักเชือก (Fid) ออกจากปลายเชือก ตอนนี้ห่วงถูกสร้างขึ้นแล้วและปลายถูกซ่อนไว้หลวมๆ",
            "เริ่มขั้นตอนการ 'รีด' (Milking) โดยจับที่จุด Mark 3 แล้วรูดปลอกเชือกหลักกลับไปทางปลายเชือกที่โผล่ออกมา",
            "รีดเชือกให้แน่นจนสุด ปลายเชือกส่วนที่เรียวจะถูกกลืนหายเข้าไปในแกนกลางอย่างสมบูรณ์ เสร็จสิ้น Long Bury Splice!"
        ];

        // สร้างข้อมูลสไลด์ ตามจำนวนคำอธิบาย
        const slidesData = Array.from({ length: descriptions.length }, (_, i) => ({
            img: `${baseUrl}${i + 1}.jpg`,
            title: `ขั้นตอนที่ ${i + 1}`,
            desc: descriptions[i]
        }));

        const track = document.getElementById('slider-track');
        const dotsContainer = document.getElementById('dots-container');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        let currentIndex = 0;

        function createSlides() {
            slidesData.forEach((slide, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'w-full flex-shrink-0 flex flex-col slide-item';
                
                const isLast = index === slidesData.length - 1;
                // โทนสี
                const accentColor = isLast ? 'border-indigo-600' : 'border-slate-400';
                const textColor = isLast ? 'text-indigo-800' : 'text-slate-800';
                const badgeColor = isLast ? 'bg-indigo-600' : 'bg-slate-500';

                slideDiv.innerHTML = `
                    <div class="h-80 sm:h-[450px] w-full flex items-center justify-center border-b-4 ${accentColor} relative overflow-hidden bg-white">
                        <div class="absolute top-4 right-4 text-white text-xs font-bold px-3 py-1 rounded-full z-10 shadow-lg ${badgeColor}">${index + 1} / ${slidesData.length}</div>
                        <img class="knot-img user-select-none object-contain p-6 transition-transform duration-700" 
                             src="${slide.img}" 
                             alt="Long Bury Splice Step ${index + 1}"
                             title="Animation: Long Bury Splice - Step ${index + 1}"
                             onerror="this.src='https://via.placeholder.com/600x600?text=Image+Not+Found'">
                    </div>
                    <div class="p-8 text-center bg-white min-h-[160px] flex flex-col justify-center">
                        <h2 class="text-xl font-extrabold mb-3 ${textColor}">${slide.title}</h2>
                        <p class="text-slate-600 leading-relaxed text-sm sm:text-base px-2 font-medium">${slide.desc}</p>
                    </div>
                `;
                track.appendChild(slideDiv);

                const dot = document.createElement('div');
                dot.className = `dot h-1.5 rounded-full transition-all duration-300 cursor-pointer ${index === 0 ? 'bg-slate-800 w-8' : 'bg-slate-300 w-2'}`;
                dot.addEventListener('click', () => {
                    currentIndex = index;
                    updateSlider();
                });
                dotsContainer.appendChild(dot);
            });
        }

        function updateSlider() {
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slidesData.length - 1;

            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                if (i === currentIndex) {
                    dot.classList.add('bg-slate-800', 'w-8');
                    dot.classList.remove('bg-slate-300', 'w-2');
                    
                    if (i === slidesData.length - 1) {
                        dot.classList.remove('bg-slate-800');
                        dot.classList.add('bg-indigo-600');
                    }
                } else {
                    dot.classList.remove('bg-slate-800', 'w-8', 'bg-indigo-600');
                    dot.classList.add('bg-slate-300', 'w-2');
                }
            });
        }

        nextBtn.addEventListener('click', () => {
            if (currentIndex < slidesData.length - 1) {
                currentIndex++;
                updateSlider();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlider();
            }
        });

        // Swipe support สำหรับมือถือ
        let startX = 0;
        let isDragging = false;

        track.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
            track.style.transition = 'none';
        }, {passive: true});

        track.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const x = e.touches[0].clientX;
            const walk = startX - x;
            track.style.transform = `translateX(calc(-${currentIndex * 100}% - ${walk}px))`;
        }, {passive: true});

        track.addEventListener('touchend', (e) => {
            isDragging = false;
            track.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
            const endX = e.changedTouches[0].clientX;
            const diff = startX - endX;
            if (Math.abs(diff) > 50) {
                if (diff > 0 && currentIndex < slidesData.length - 1) currentIndex++;
                else if (diff < 0 && currentIndex > 0) currentIndex--;
            }
            updateSlider();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextBtn.click();
            if (e.key === 'ArrowLeft') prevBtn.click();
        });

        window.onload = () => {
            createSlides();
            updateSlider();
            lucide.createIcons();
        };

        window.addEventListener('resize', updateSlider);
    </script>
</body>
</html>
