<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วิธีผูกเงื่อนศัลยแพทย์แบบรูด (Surgical Slip Tie)</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- ตั้งค่าฟอนต์ภาษาไทย -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f1f5f9;
        }
        .slide-transition {
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .knot-img {
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            max-width: 100%;
            height: auto;
        }
        .user-select-none {
            user-select: none;
            -webkit-user-drag: none;
        }
        .dot {
            height: 6px; 
            border-radius: 9999px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- คอนเทนเนอร์หลัก -->
    <div class="w-full max-w-xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden relative border border-slate-200">
        
        <!-- ส่วนหัว -->
        <div class="bg-blue-800 text-white p-6 text-center shadow-md relative z-10">
            <h1 class="text-2xl font-bold tracking-wide">วิธีผูกเงื่อนศัลยแพทย์แบบรูด</h1>
            <h2 class="text-lg font-medium mt-1 text-blue-200">(Surgical Slip Tie)</h2>
            <p class="text-blue-50 text-sm mt-2 opacity-90">เทคนิคการผูกที่มั่นคงและปรับความตึงได้ง่าย เหมาะสำหรับงานที่ต้องการความละเอียดสูง</p>
        </div>

        <!-- พื้นที่สไลเดอร์ -->
        <div id="slider-container" class="relative overflow-hidden w-full touch-pan-y bg-white">
            <div id="slider-track" class="flex slide-transition w-full cursor-grab active:cursor-grabbing">
                <!-- สไลด์จะถูกสร้างด้วย JavaScript -->
            </div>
        </div>

        <!-- ปุ่มควบคุม -->
        <button id="prevBtn" class="absolute top-[40%] left-4 -translate-y-1/2 bg-white/90 backdrop-blur text-slate-800 p-3 rounded-full shadow-lg hover:bg-blue-50 hover:scale-110 transition-all disabled:opacity-20 z-20 focus:outline-none border border-slate-100">
            <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <button id="nextBtn" class="absolute top-[40%] right-4 -translate-y-1/2 bg-white/90 backdrop-blur text-slate-800 p-3 rounded-full shadow-lg hover:bg-blue-50 hover:scale-110 transition-all disabled:opacity-20 z-20 focus:outline-none border border-slate-100">
            <i data-lucide="chevron-right" class="w-6 h-6"></i>
        </button>

        <!-- จุด Indicators -->
        <div class="flex justify-center flex-wrap gap-1.5 px-6 pb-6 pt-2 bg-white" id="dots-container"></div>
        
        <!-- ข้อมูลสรุปด้านล่าง -->
        <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 text-center flex flex-col items-center">
            <div class="flex items-center gap-2 mb-1">
                <span class="inline-block w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Medical Training Animation</p>
            </div>
            <p class="text-[11px] text-slate-400">อ้างอิงลำดับภาพจาก Animated Knots</p>
        </div>
    </div>

    <script>
        // ข้อมูล URL และขั้นตอนสำหรับ Surgical Slip Tie (15 ขั้นตอน)
        const baseUrl = "https://www.animatedknots.com/photos/surgicalslip/surgicalslipR";
        
        const descriptions = [
            "เตรียมเส้นด้ายหรือเชือกสำหรับการผูก โดยจับปลายทั้งสองข้างให้พร้อม",
            "นำปลายด้านขวาไขว้ทับด้านซ้ายเพื่อเตรียมการทำปมแรก",
            "พันปลายเชือกรอบเชือกอีกเส้นหนึ่งรอบ เพื่อสร้างฐานของเงื่อน",
            "พันทับซ้ำอีกหนึ่งรอบเพื่อให้เป็น Double Throw (เงื่อนศัลยแพทย์ส่วนแรก)",
            "ดึงปลายทั้งสองข้างเพื่อปรับตำแหน่งของปมให้เข้าที่",
            "ใช้แรงดึงอย่างสม่ำเสมอเพื่อให้ปมมีความแน่นและเรียบเนียน",
            "เริ่มสร้างโครงสร้างที่ช่วยในการรูดโดยการดึงมุมของเชือก",
            "จัดระเบียบเกลียวเชือกเพื่อให้สามารถเคลื่อนที่ได้โดยไม่ติดขัด",
            "ทำการพันครั้งถัดไปโดยเน้นการสร้างห่วงที่สามารถเลื่อนได้",
            "สอดปลายเชือกผ่านห่วงที่เตรียมไว้เพื่อเริ่มล็อคปมชั้นที่สอง",
            "ดึงปมให้เคลื่อนที่ไปตามเส้นหลักเพื่อให้ปมชิดกับตำแหน่งที่ต้องการ",
            "ตรวจสอบความตึงและการวางตัวของเชือกไม่ให้พันกันยุ่งเหยิง",
            "กระชับเงื่อนในขั้นตอนสุดท้ายก่อนทำการล็อคตาย",
            "ดึงปลายทั้งสองข้างสวนทางกันอย่างแรงเพื่อให้ปมล็อคแน่น",
            "เสร็จสิ้นการผูกเงื่อนศัลยแพทย์แบบรูดที่สมบูรณ์และมั่นใจได้ในความปลอดภัย"
        ];

        const totalSteps = 15; // ตามรูปที่ผู้ใช้ระบุ R15
        const slidesData = Array.from({ length: totalSteps }, (_, i) => ({
            img: `${baseUrl}${i + 1}.jpg`,
            title: `ขั้นตอนที่ ${i + 1}`,
            desc: descriptions[i] || "กำลังตรวจสอบความถูกต้องของปม..."
        }));

        const track = document.getElementById('slider-track');
        const dotsContainer = document.getElementById('dots-container');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        let currentIndex = 0;

        function createSlides() {
            track.innerHTML = '';
            dotsContainer.innerHTML = '';

            slidesData.forEach((slide, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'w-full flex-shrink-0 flex flex-col slide-item';
                
                const isLast = index === slidesData.length - 1;
                const accentColor = isLast ? 'border-blue-600' : 'border-blue-400';
                const textColor = isLast ? 'text-blue-700' : 'text-slate-800';
                const badgeColor = isLast ? 'bg-blue-600' : 'bg-blue-500';

                slideDiv.innerHTML = `
                    <div class="h-64 sm:h-96 w-full flex items-center justify-center border-b-4 ${accentColor} relative overflow-hidden bg-white">
                        <div class="absolute top-4 right-4 text-white text-[10px] font-bold px-3 py-1 rounded-full z-10 shadow-md ${badgeColor}">${index + 1} / ${slidesData.length}</div>
                        <img id="Knot_${index}" class="knot-img user-select-none object-contain p-2 transition-transform duration-700" 
                             style="width: 100%; height: 100%;" 
                             src="${slide.img}" 
                             alt="Surgical Slip Tie, Step-by-Step Animation" 
                             onerror="this.src='https://via.placeholder.com/600x600?text=กำลังโหลดภาพ...'">
                    </div>
                    <div class="p-8 text-center bg-white min-h-[140px] flex flex-col justify-center">
                        <h2 class="text-xl font-bold mb-2 ${textColor}">${slide.title}</h2>
                        <p class="text-slate-600 leading-relaxed text-sm sm:text-base font-medium">${slide.desc}</p>
                    </div>
                `;
                track.appendChild(slideDiv);

                const dot = document.createElement('div');
                dot.className = `dot transition-all duration-300 ${index === 0 ? 'bg-blue-800 w-8' : 'bg-slate-300 w-3'}`;
                dot.addEventListener('click', () => {
                    currentIndex = index;
                    updateSlider();
                });
                dotsContainer.appendChild(dot);
            });
        }

        function updateSlider() {
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slidesData.length - 1;

            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                if (i === currentIndex) {
                    dot.classList.add('bg-blue-800', 'w-8');
                    dot.classList.remove('bg-slate-300', 'w-3');
                } else {
                    dot.classList.remove('bg-blue-800', 'w-8');
                    dot.classList.add('bg-slate-300', 'w-3');
                }
            });
        }

        nextBtn.addEventListener('click', () => {
            if (currentIndex < slidesData.length - 1) {
                currentIndex++;
                updateSlider();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlider();
            }
        });

        // Touch Swipe Support
        let startX = 0;
        let isDragging = false;

        track.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
            track.style.transition = 'none';
        }, {passive: true});

        track.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const x = e.touches[0].clientX;
            const walk = startX - x;
            track.style.transform = `translateX(calc(-${currentIndex * 100}% - ${walk}px))`;
        }, {passive: true});

        track.addEventListener('touchend', (e) => {
            isDragging = false;
            track.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
            const endX = e.changedTouches[0].clientX;
            const diff = startX - endX;
            if (Math.abs(diff) > 50) {
                if (diff > 0 && currentIndex < slidesData.length - 1) currentIndex++;
                else if (diff < 0 && currentIndex > 0) currentIndex--;
            }
            updateSlider();
        });

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextBtn.click();
            if (e.key === 'ArrowLeft') prevBtn.click();
        });

        window.onload = () => {
            createSlides();
            updateSlider();
            lucide.createIcons();
        };

        window.addEventListener('resize', updateSlider);
    </script>
</body>
</html>
