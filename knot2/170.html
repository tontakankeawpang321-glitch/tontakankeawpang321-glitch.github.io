<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วิธีการขดเชือกที่ติดกับหลัก (Coiling Attached Rope)</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- ตั้งค่าฟอนต์ภาษาไทย -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f8fafc;
        }
        .slide-transition {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .knot-img {
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            max-width: 100%;
            height: auto;
        }
        .user-select-none {
            user-select: none;
            -webkit-user-drag: none;
        }
        .dot {
            height: 6px; 
            border-radius: 9999px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        #slider-track {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- คอนเทนเนอร์หลัก -->
    <div class="w-full max-w-xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden relative border border-slate-200">
        
        <!-- ส่วนหัว -->
        <div class="bg-teal-700 text-white p-6 text-center shadow-md relative z-10">
            <h1 class="text-2xl font-bold tracking-wide">วิธีการขดเชือก (Coiling Attached Rope)</h1>
            <h2 class="text-lg font-medium mt-1 text-teal-100">การจัดเก็บเชือกที่ติดอยู่กับหลักหรือห่วง</h2>
            <p class="text-teal-50 text-xs mt-2 opacity-90">วิธีจัดการกับเชือกที่ปลายข้างหนึ่งถูกยึดไว้ เพื่อให้เรียบร้อยและพร้อมใช้งานทันที</p>
        </div>

        <!-- พื้นที่สไลเดอร์ -->
        <div id="slider-container" class="relative overflow-hidden w-full touch-pan-y bg-white">
            <div id="slider-track" class="flex slide-transition w-full cursor-grab active:cursor-grabbing">
                <!-- สไลด์จะถูกสร้างด้วย JavaScript -->
            </div>
        </div>

        <!-- ปุ่มควบคุม -->
        <button id="prevBtn" class="absolute top-[40%] left-3 -translate-y-1/2 bg-white/95 backdrop-blur text-slate-800 p-3 rounded-full shadow-lg hover:bg-teal-50 hover:scale-110 transition-all disabled:opacity-30 z-20 focus:outline-none border border-slate-100">
            <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <button id="nextBtn" class="absolute top-[40%] right-3 -translate-y-1/2 bg-white/95 backdrop-blur text-slate-800 p-3 rounded-full shadow-lg hover:bg-teal-50 hover:scale-110 transition-all disabled:opacity-30 z-20 focus:outline-none border border-slate-100">
            <i data-lucide="chevron-right" class="w-6 h-6"></i>
        </button>

        <!-- จุด Indicators -->
        <div class="flex justify-center flex-wrap gap-1.5 px-6 pb-6 pt-3 bg-white" id="dots-container"></div>
        
        <!-- ข้อมูลสรุปด้านล่าง -->
        <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 text-center flex flex-col items-center">
            <div class="flex items-center gap-2 mb-1">
                <span class="px-2 py-0.5 bg-teal-100 text-teal-700 text-[10px] font-bold rounded">ข้อดี</span>
                <p class="text-[11px] text-slate-500 font-medium italic">ป้องกันเชือกพันกัน และสามารถปลดออกมาใช้งานได้อย่างรวดเร็วโดยไม่ติดขัด</p>
            </div>
            <p class="text-[10px] text-slate-400 font-medium uppercase tracking-widest mt-1">Reference: Animated Knots - Coiling Attached Rope</p>
        </div>
    </div>

    <script>
        // URL สำหรับ Coiling Attached Rope
        const baseUrl = "https://www.animatedknots.com/photos/coilattached/coilattachedR";
        
        // คำอธิบายขั้นตอนภาษาไทยสำหรับ Coiling Attached Rope
        const descriptions = [
            "เริ่มต้นโดยจับเชือกส่วนที่ติดกับหลักไว้ในมือข้างหนึ่ง",
            "ใช้มืออีกข้างดึงเชือกออกมาเป็นระยะสั้นๆ เพื่อเตรียมทำห่วงแรก",
            "พาดเชือกกลับมาวางทับบนมือที่ถือหลักไว้ ให้เกิดเป็นห่วงวงกลม",
            "ทำห่วงถัดไปโดยพยายามรักษาขนาดให้ใกล้เคียงกับห่วงแรก",
            "บิดเชือกเล็กน้อยขณะทำห่วงเพื่อให้เชือกเรียงตัวตามธรรมชาติและไม่บิดเกลียว",
            "ทำห่วงซ้อนกันไปเรื่อยๆ จนเหลือปลายเชือกยาวพอสำหรับพันรอบ",
            "รวบกลุ่มห่วงทั้งหมดเข้าด้วยกัน แล้วเริ่มพันปลายเชือกที่เหลือรอบขดเชือก",
            "พันปลายเชือกรัดรอบกลุ่มห่วงให้แน่นหลายๆ รอบเพื่อความมั่นคง",
            "สอดปลายเชือกที่เหลือลอดผ่านช่องว่างด้านบนของขดเชือก",
            "ดึงปลายเชือกให้แน่นเพื่อล็อคทุกอย่างเข้าด้วยกัน",
            "ตรวจสอบความเรียบร้อย ขดเชือกจะอยู่รวมกันเป็นระเบียบและไม่คลายตัว"
        ];

        const totalSteps = descriptions.length;
        const slidesData = Array.from({ length: totalSteps }, (_, i) => ({
            img: `${baseUrl}${i + 1}.jpg`,
            title: `ขั้นตอนที่ ${i + 1}`,
            desc: descriptions[i]
        }));

        const track = document.getElementById('slider-track');
        const dotsContainer = document.getElementById('dots-container');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        let currentIndex = 0;

        function createSlides() {
            track.innerHTML = '';
            dotsContainer.innerHTML = '';

            slidesData.forEach((slide, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'w-full flex-shrink-0 flex flex-col slide-item';
                
                const isLast = index === slidesData.length - 1;
                const accentColor = isLast ? 'border-emerald-500' : 'border-teal-600';
                const textColor = isLast ? 'text-emerald-600' : 'text-slate-800';
                const badgeColor = isLast ? 'bg-emerald-500' : 'bg-teal-600';

                slideDiv.innerHTML = `
                    <div class="h-72 sm:h-[400px] w-full flex items-center justify-center border-b-4 ${accentColor} relative overflow-hidden bg-white">
                        <div class="absolute top-4 right-4 text-white text-[10px] font-bold px-3 py-1 rounded-full z-10 shadow-md ${badgeColor}">${index + 1} / ${slidesData.length}</div>
                        <img class="knot-img user-select-none object-contain p-4 transition-transform duration-700" 
                             src="${slide.img}" 
                             alt="Coiling Attached Rope Step ${index + 1}" 
                             onerror="this.src='https://via.placeholder.com/600x600?text=Step+${index+1}'">
                    </div>
                    <div class="p-8 text-center bg-white min-h-[160px] flex flex-col justify-center">
                        <h2 class="text-xl font-extrabold mb-3 ${textColor}">${slide.title}</h2>
                        <p class="text-slate-600 leading-relaxed text-sm sm:text-base px-2 font-medium">${slide.desc}</p>
                    </div>
                `;
                track.appendChild(slideDiv);

                const dot = document.createElement('div');
                dot.className = `dot transition-all duration-300 ${index === 0 ? 'bg-teal-600 w-8' : 'bg-slate-300 w-3'}`;
                dot.addEventListener('click', () => {
                    currentIndex = index;
                    updateSlider();
                });
                dotsContainer.appendChild(dot);
            });
        }

        function updateSlider() {
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slidesData.length - 1;

            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                if (i === currentIndex) {
                    dot.classList.add(i === slidesData.length - 1 ? 'bg-emerald-500' : 'bg-teal-600', 'w-8');
                    dot.classList.remove('bg-slate-300', 'w-3');
                } else {
                    dot.classList.remove('bg-teal-600', 'w-8', 'bg-emerald-500');
                    dot.classList.add('bg-slate-300', 'w-3');
                }
            });
        }

        nextBtn.addEventListener('click', () => {
            if (currentIndex < slidesData.length - 1) {
                currentIndex++;
                updateSlider();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlider();
            }
        });

        // Touch Swipe Support
        let startX = 0;
        let isDragging = false;

        track.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
            track.style.transition = 'none';
        }, {passive: true});

        track.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const x = e.touches[0].clientX;
            const walk = startX - x;
            track.style.transform = `translateX(calc(-${currentIndex * 100}% - ${walk}px))`;
        }, {passive: true});

        track.addEventListener('touchend', (e) => {
            isDragging = false;
            track.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
            const endX = e.changedTouches[0].clientX;
            const diff = startX - endX;
            if (Math.abs(diff) > 50) {
                if (diff > 0 && currentIndex < slidesData.length - 1) currentIndex++;
                else if (diff < 0 && currentIndex > 0) currentIndex--;
            }
            updateSlider();
        });

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextBtn.click();
            if (e.key === 'ArrowLeft') prevBtn.click();
        });

        // Initialize
        window.onload = () => {
            createSlides();
            updateSlider();
            lucide.createIcons();
        };

        window.addEventListener('resize', updateSlider);
    </script>
</body>
</html>
