<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วิธีผูกเงื่อนศัลยกรรมด้วยเครื่องมือ (Surgical Ligature Instrument Tie) - คู่มือทีละขั้นตอน</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- ตั้งค่าฟอนต์ภาษาไทย -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #eff6ff; /* พื้นหลังสีฟ้าอ่อน โทนการแพทย์ */
        }
        .slide-transition {
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .knot-img {
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            max-width: 100%;
            height: auto;
        }
        .user-select-none {
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- คอนเทนเนอร์หลัก -->
    <div class="w-full max-w-xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden relative border border-blue-100">
        
        <!-- ส่วนหัว -->
        <div class="bg-blue-800 text-white p-6 text-center shadow-md relative z-10">
            <h1 class="text-2xl font-bold tracking-wide">Surgical Ligature</h1>
            <h2 class="text-lg font-medium mt-1 text-blue-200">Instrument Technique</h2>
            <p class="text-blue-100 text-sm mt-2 opacity-90">การผูกเงื่อนศัลยกรรมด้วยเครื่องมือ: วิธีการผูกไหมเย็บแผลโดยใช้เครื่องมือจับเข็ม (Needle Holder) เพื่อความรวดเร็วและแม่นยำ</p>
        </div>

        <!-- พื้นที่สไลเดอร์ -->
        <div id="slider-container" class="relative overflow-hidden w-full touch-pan-y">
            <!-- แทร็กสไลเดอร์ -->
            <div id="slider-track" class="flex slide-transition w-full cursor-grab active:cursor-grabbing">
                <!-- สไลด์จะถูกสร้างด้วย JavaScript -->
            </div>
        </div>

        <!-- ปุ่มควบคุม -->
        <button id="prevBtn" class="absolute top-[45%] left-3 -translate-y-1/2 bg-white/95 backdrop-blur text-slate-800 p-3 rounded-full shadow-lg hover:bg-white hover:scale-110 transition-all disabled:opacity-30 z-20 focus:outline-none border border-slate-100">
            <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <button id="nextBtn" class="absolute top-[45%] right-3 -translate-y-1/2 bg-white/95 backdrop-blur text-slate-800 p-3 rounded-full shadow-lg hover:bg-white hover:scale-110 transition-all disabled:opacity-30 z-20 focus:outline-none border border-slate-100">
            <i data-lucide="chevron-right" class="w-6 h-6"></i>
        </button>

        <!-- จุด Indicators -->
        <div class="flex justify-center flex-wrap gap-1.5 px-4 pb-6 pt-2 bg-white" id="dots-container"></div>
        
        <!-- ข้อมูลสรุปด้านล่าง -->
        <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 text-center flex flex-col items-center">
            <p class="text-xs text-gray-400 font-medium italic">ที่มาของภาพ: Animated Knots (Surgical Ligature, Instrument Technique)</p>
        </div>
    </div>

    <script>
        // ข้อมูลสไลด์สำหรับ Surgical Ligature (Instrument Technique)
        const baseUrl = "https://www.animatedknots.com/photos/ligatureinstrument/ligatureinstrumentR";
        
        // คำอธิบายขั้นตอน 16 ขั้นตอน
        const descriptions = [
            "วางไหมเย็บแผล (Suture) โดยให้ปลายเส้นสั้นอยู่ด้านบน และถือเครื่องมือจับเข็ม (Needle Holder) ไว้เหนือไหมเส้นยาว",
            "ใช้มือซ้ายจับไหมเส้นยาว พันรอบเครื่องมือจับเข็ม (ม้วนไปด้านหน้า 1 รอบ)",
            "พันไหมเส้นยาวรอบเครื่องมือจับเข็มอีก 1 รอบ (รวมเป็น 2 รอบ เพื่อทำ Surgeon's Knot ป้องกันการคลายตัว)",
            "อ้าปากเครื่องมือจับเข็ม เตรียมคีบปลายไหมเส้นสั้นที่อยู่ด้านบน",
            "ใช้เครื่องมือคีบที่ปลายไหมเส้นสั้นให้แน่นหนา",
            "ดึงปลายไหมเส้นสั้นลอดผ่านห่วงทั้ง 2 รอบที่พันไว้บนเครื่องมือจับเข็ม",
            "ดึงไหมทั้งสองข้างสวนทางกัน เพื่อเตรียมรูดปมลงไปที่บาดแผล",
            "ดึงไหมไขว้ข้ามกันให้ตึง (สังเกตว่ามือขวาและซ้ายต้องดึงสลับฝั่งกัน เพื่อให้ปมแบนราบเรียบไปกับเนื้อเยื่อ)",
            "รูดปมแรกลงไปให้ชิดและแนบสนิทกับเนื้อเยื่อหรือบาดแผล (ดึงให้ตึงพอดี)",
            "เริ่มต้นทำปมที่สอง โดยวางเครื่องมือจับเข็มไว้เหนือไหมเส้นยาวอีกครั้ง",
            "พันไหมเส้นยาวรอบเครื่องมือ 1 รอบ (คราวนี้พันทิศทางย้อนกลับ หรือเข้าหาตัว ตรงข้ามกับปมแรก)",
            "อ้าปากเครื่องมือและทำการคีบปลายไหมเส้นสั้นอีกครั้ง",
            "ดึงปลายไหมเส้นสั้นลอดผ่านห่วงที่พันไว้บนเครื่องมือ",
            "ดึงไหมทั้งสองข้างสวนทางกันอีกครั้ง (ดึงกลับมาในตำแหน่งเริ่มต้นก่อนผูกปมแรก)",
            "ดึงให้ตึงเพื่อล็อคปมที่สองทับปมแรกให้แน่นสนิท (กลายเป็น Square Knot ทับ Surgeon's Knot)",
            "เสร็จสมบูรณ์! ได้เงื่อน Surgical Ligature แบบใช้เครื่องมือที่แน่นหนาและปลอดภัย พร้อมสำหรับการตัดปลายไหม"
        ];

        // สร้างข้อมูลสไลด์ ตามจำนวนคำอธิบาย
        const slidesData = Array.from({ length: descriptions.length }, (_, i) => ({
            img: `${baseUrl}${i + 1}.jpg`,
            title: `ขั้นตอนที่ ${i + 1}`,
            desc: descriptions[i]
        }));

        const track = document.getElementById('slider-track');
        const dotsContainer = document.getElementById('dots-container');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        let currentIndex = 0;

        function createSlides() {
            slidesData.forEach((slide, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'w-full flex-shrink-0 flex flex-col slide-item';
                
                const isLast = index === slidesData.length - 1;
                // โทนสีฟ้า/น้ำเงิน สำหรับการแพทย์
                const accentColor = isLast ? 'border-blue-700' : 'border-blue-400';
                const textColor = isLast ? 'text-blue-900' : 'text-slate-900';
                const badgeColor = isLast ? 'bg-blue-700' : 'bg-blue-500';

                slideDiv.innerHTML = `
                    <div class="h-80 sm:h-[450px] w-full flex items-center justify-center border-b-4 ${accentColor} relative overflow-hidden bg-white">
                        <div class="absolute top-4 right-4 text-white text-xs font-bold px-3 py-1 rounded-full z-10 shadow-lg ${badgeColor}">${index + 1} / ${slidesData.length}</div>
                        <img class="knot-img user-select-none object-contain p-6 transition-transform duration-700" 
                             src="${slide.img}" 
                             alt="Surgical Ligature, Instrument Technique Step ${index + 1}"
                             title="Animation: Surgical Ligature, Instrument Technique - Step ${index + 1}"
                             onerror="this.src='https://via.placeholder.com/600x600?text=Image+Not+Found'">
                    </div>
                    <div class="p-8 text-center bg-white min-h-[160px] flex flex-col justify-center">
                        <h2 class="text-xl font-extrabold mb-3 ${textColor}">${slide.title}</h2>
                        <p class="text-gray-600 leading-relaxed text-sm sm:text-base px-2 font-medium">${slide.desc}</p>
                    </div>
                `;
                track.appendChild(slideDiv);

                const dot = document.createElement('div');
                dot.className = `dot h-1.5 rounded-full transition-all duration-300 cursor-pointer ${index === 0 ? 'bg-blue-600 w-8' : 'bg-gray-200 w-2'}`;
                dot.addEventListener('click', () => {
                    currentIndex = index;
                    updateSlider();
                });
                dotsContainer.appendChild(dot);
            });
        }

        function updateSlider() {
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slidesData.length - 1;

            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                if (i === currentIndex) {
                    dot.classList.add('bg-blue-600', 'w-8');
                    dot.classList.remove('bg-gray-200', 'w-2');
                } else {
                    dot.classList.remove('bg-blue-600', 'w-8');
                    dot.classList.add('bg-gray-200', 'w-2');
                }
            });
        }

        nextBtn.addEventListener('click', () => {
            if (currentIndex < slidesData.length - 1) {
                currentIndex++;
                updateSlider();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlider();
            }
        });

        // Swipe support สำหรับมือถือ
        let startX = 0;
        let isDragging = false;

        track.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
            track.style.transition = 'none';
        }, {passive: true});

        track.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const x = e.touches[0].clientX;
            const walk = startX - x;
            track.style.transform = `translateX(calc(-${currentIndex * 100}% - ${walk}px))`;
        }, {passive: true});

        track.addEventListener('touchend', (e) => {
            isDragging = false;
            track.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
            const endX = e.changedTouches[0].clientX;
            const diff = startX - endX;
            if (Math.abs(diff) > 50) {
                if (diff > 0 && currentIndex < slidesData.length - 1) currentIndex++;
                else if (diff < 0 && currentIndex > 0) currentIndex--;
            }
            updateSlider();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextBtn.click();
            if (e.key === 'ArrowLeft') prevBtn.click();
        });

        window.onload = () => {
            createSlides();
            updateSlider();
            lucide.createIcons();
        };

        window.addEventListener('resize', updateSlider);
    </script>
</body>
</html>
