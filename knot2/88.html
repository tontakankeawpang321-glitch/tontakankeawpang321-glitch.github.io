<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วิธีเงื่อนผูกทแยง (Diagonal Lashing) - คู่มือทีละขั้นตอน</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- ตั้งค่าฟอนต์ภาษาไทย -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f0fdf4; /* เปลี่ยนพื้นหลังให้ดูเป็นธรรมชาติ (เขียวอ่อน) */
        }
        .slide-transition {
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .knot-img {
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            max-width: 100%;
            height: auto;
        }
        .user-select-none {
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- คอนเทนเนอร์หลัก -->
    <div class="w-full max-w-xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden relative border border-gray-100">
        
        <!-- ส่วนหัว -->
        <div class="bg-emerald-700 text-white p-6 text-center shadow-md relative z-10">
            <h1 class="text-2xl font-bold tracking-wide">Diagonal Lashing</h1>
            <p class="text-emerald-100 text-sm mt-1 opacity-90">เงื่อนผูกทแยง: ใช้สำหรับผูกไม้สองท่อนที่ไขว้กันให้แน่นหนา มักเริ่มต้นด้วยเงื่อนผูกรั้ง (Timber Hitch) เหมาะสำหรับงานบุกเบิกและสร้างค่าย</p>
        </div>

        <!-- พื้นที่สไลเดอร์ -->
        <div id="slider-container" class="relative overflow-hidden w-full touch-pan-y">
            <!-- แทร็กสไลเดอร์ -->
            <div id="slider-track" class="flex slide-transition w-full cursor-grab active:cursor-grabbing">
                <!-- สไลด์จะถูกสร้างด้วย JavaScript -->
            </div>
        </div>

        <!-- ปุ่มควบคุม -->
        <button id="prevBtn" class="absolute top-[40%] left-3 -translate-y-1/2 bg-white/95 backdrop-blur text-slate-800 p-3 rounded-full shadow-lg hover:bg-white hover:scale-110 transition-all disabled:opacity-30 z-20 focus:outline-none border border-slate-100">
            <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <button id="nextBtn" class="absolute top-[40%] right-3 -translate-y-1/2 bg-white/95 backdrop-blur text-slate-800 p-3 rounded-full shadow-lg hover:bg-white hover:scale-110 transition-all disabled:opacity-30 z-20 focus:outline-none border border-slate-100">
            <i data-lucide="chevron-right" class="w-6 h-6"></i>
        </button>

        <!-- จุด Indicators -->
        <div class="flex justify-center flex-wrap gap-1.5 px-4 pb-6 pt-2 bg-white" id="dots-container"></div>
        
        <!-- ข้อมูลสรุปด้านล่าง -->
        <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 text-center">
            <p class="text-xs text-gray-400 font-medium italic">ที่มาของภาพ: Animated Knots (Sequence R1 - R15)</p>
        </div>
    </div>

    <script>
        // ข้อมูลสไลด์สำหรับ Diagonal Lashing (R1 - R15)
        const baseUrl = "https://www.animatedknots.com/photos/lashdiagonal/lashdiagonalR";
        
        const descriptions = [
            "เริ่มต้นด้วยการผูกเงื่อนผูกรั้ง (Timber Hitch) รวบไม้ทั้งสองท่อนที่จุดไขว้กัน",
            "ดึงปลายเชือกให้แน่น เพื่อดึงไม้ทั้งสองท่อนให้แนบเข้าหากันให้มากที่สุด",
            "เริ่มพันเชือกข้ามมุมทแยงมุมแรก โดยพันอ้อมไม้ทั้งสองท่อน",
            "ดึงเชือกให้ตึงและพันรอบมุมทแยงเดิมเป็นรอบที่ 2",
            "พันเชือกทับในมุมทแยงเดิมเป็นรอบที่ 3 (ควรเรียงเส้นเชือกให้ขนานกัน ไม่ทับซ้อนกัน)",
            "พันเชือกเป็นรอบที่ 4 ในมุมทแยงเดิม จัดเรียงเส้นเชือกให้สวยงามและดึงให้ตึงเสมอ",
            "เปลี่ยนทิศทางการพันเชือก โดยเตรียมพันข้ามไปยังมุมทแยงอีกด้านหนึ่ง (กากบาททับรอยเดิม)",
            "พันเชือกข้ามมุมทแยงใหม่เป็นรอบที่ 1",
            "พันเชือกรอบมุมทแยงใหม่เป็นรอบที่ 2 ดึงให้เชือกรัดไม้แน่นขึ้น",
            "พันเชือกในมุมทแยงใหม่นี้ให้ครบ 3-4 รอบเช่นเดียวกัน (ในภาพคือรอบที่ 3)",
            "เปลี่ยนทิศทางเชือกเพื่อทำขั้นตอน 'พันรัด' (Frapping) โดยพันเชือกรอบรอยต่อระหว่างไม้ทั้งสองท่อน (ไม่ข้ามไม้)",
            "พันรัด (Frapping) รอบแรก ดึงเชือกให้แน่นที่สุดเพื่อบีบให้เส้นเชือกที่พันไว้ก่อนหน้ารัดไม้แน่นเข้าด้วยกัน (หักคอไก่)",
            "พันรัดต่อไปเป็นรอบที่ 2 หรือ 3 ดึงให้ตึงสุดแรงในทุกๆ รอบ",
            "เตรียมจบเงื่อน โดยนำปลายเชือกไปพันรอบไม้ท่อนใดท่อนหนึ่งเพื่อเตรียมผูกเงื่อนตะกรุดเบ็ด (Clove Hitch)",
            "ผูกเงื่อนตะกรุดเบ็ดให้สมบูรณ์ ดึงให้ตึงและจัดแต่งเงื่อนให้แน่นหนา เป็นอันเสร็จสิ้นเงื่อนผูกทแยง!"
        ];

        // สร้างข้อมูล 15 สไลด์ ตามจำนวนคำอธิบายและรูปภาพที่มี
        const slidesData = Array.from({ length: descriptions.length }, (_, i) => ({
            img: `${baseUrl}${i + 1}.jpg`,
            title: `ขั้นตอนที่ ${i + 1}`,
            desc: descriptions[i]
        }));

        const track = document.getElementById('slider-track');
        const dotsContainer = document.getElementById('dots-container');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        let currentIndex = 0;

        function createSlides() {
            slidesData.forEach((slide, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'w-full flex-shrink-0 flex flex-col slide-item';
                
                const isLast = index === slidesData.length - 1;
                const accentColor = isLast ? 'border-emerald-600' : 'border-emerald-400';
                const textColor = isLast ? 'text-emerald-800' : 'text-slate-900';
                const badgeColor = isLast ? 'bg-emerald-600' : 'bg-emerald-500';

                slideDiv.innerHTML = `
                    <div class="h-80 sm:h-[450px] w-full flex items-center justify-center border-b-4 ${accentColor} relative overflow-hidden bg-white">
                        <div class="absolute top-4 right-4 text-white text-xs font-bold px-3 py-1 rounded-full z-10 shadow-lg ${badgeColor}">${index + 1} / ${slidesData.length}</div>
                        <img class="knot-img user-select-none object-contain p-6 transition-transform duration-700" 
                             src="${slide.img}" 
                             alt="Diagonal Lashing Technique Step ${index + 1}"
                             title="Animation: Diagonal Lashing Technique - Step ${index + 1}"
                             onerror="this.src='https://via.placeholder.com/600x600?text=Image+Not+Found'">
                    </div>
                    <div class="p-8 text-center bg-white min-h-[160px] flex flex-col justify-center">
                        <h2 class="text-xl font-extrabold mb-3 ${textColor}">${slide.title}</h2>
                        <p class="text-gray-600 leading-relaxed text-sm sm:text-base px-4 font-medium">${slide.desc}</p>
                    </div>
                `;
                track.appendChild(slideDiv);

                const dot = document.createElement('div');
                dot.className = `dot h-1.5 rounded-full transition-all duration-300 cursor-pointer ${index === 0 ? 'bg-emerald-500 w-8' : 'bg-gray-200 w-2'}`;
                dot.addEventListener('click', () => {
                    currentIndex = index;
                    updateSlider();
                });
                dotsContainer.appendChild(dot);
            });
        }

        function updateSlider() {
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slidesData.length - 1;

            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                if (i === currentIndex) {
                    dot.classList.add('bg-emerald-500', 'w-8');
                    dot.classList.remove('bg-gray-200', 'w-2');
                } else {
                    dot.classList.remove('bg-emerald-500', 'w-8');
                    dot.classList.add('bg-gray-200', 'w-2');
                }
            });
        }

        nextBtn.addEventListener('click', () => {
            if (currentIndex < slidesData.length - 1) {
                currentIndex++;
                updateSlider();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlider();
            }
        });

        // Swipe support สำหรับมือถือ
        let startX = 0;
        let isDragging = false;

        track.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
            track.style.transition = 'none';
        }, {passive: true});

        track.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const x = e.touches[0].clientX;
            const walk = startX - x;
            track.style.transform = `translateX(calc(-${currentIndex * 100}% - ${walk}px))`;
        }, {passive: true});

        track.addEventListener('touchend', (e) => {
            isDragging = false;
            track.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
            const endX = e.changedTouches[0].clientX;
            const diff = startX - endX;
            if (Math.abs(diff) > 50) {
                if (diff > 0 && currentIndex < slidesData.length - 1) currentIndex++;
                else if (diff < 0 && currentIndex > 0) currentIndex--;
            }
            updateSlider();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextBtn.click();
            if (e.key === 'ArrowLeft') prevBtn.click();
        });

        window.onload = () => {
            createSlides();
            updateSlider();
            lucide.createIcons();
        };

        window.addEventListener('resize', updateSlider);
    </script>
</body>
</html>
