<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วิธีผูกเงื่อนแนทฮิทช์ (Gnat Hitch)</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- ตั้งค่าฟอนต์ภาษาไทย -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f0f4f8;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .image-placeholder {
            background: #ffffff;
        }
        .slide-item {
            transition: opacity 0.3s ease;
        }
        #slider-track {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .knot-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: white;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- คอนเทนเนอร์หลัก -->
    <div class="w-full max-w-md mx-auto bg-white rounded-[2rem] shadow-2xl overflow-hidden relative border border-gray-100">
        
        <!-- ส่วนหัว -->
        <div class="bg-sky-700 text-white p-6 text-center shadow-md relative z-10">
            <h1 class="text-2xl font-bold tracking-wide leading-tight">เงื่อนแนทฮิทช์</h1>
            <h2 class="text-lg font-medium opacity-80">(Gnat Hitch)</h2>
            <p class="text-sky-100 text-xs mt-1">เงื่อนผูกยึดวัตถุที่รัดแน่น มั่นคง แต่แก้ออกได้ง่าย</p>
        </div>

        <!-- พื้นที่สไลเดอร์ -->
        <div id="slider-container" class="relative overflow-hidden w-full touch-pan-y bg-white">
            <div id="slider-track" class="w-full cursor-grab active:cursor-grabbing">
                <!-- สไลด์จะถูกสร้างผ่าน JavaScript ภาพ Gnat R1-R7 -->
            </div>
        </div>

        <!-- ปุ่มควบคุม -->
        <button id="prevBtn" class="absolute top-[35%] left-3 -translate-y-1/2 bg-white/90 backdrop-blur-md text-sky-900 p-2.5 rounded-full shadow-lg hover:bg-white hover:scale-110 transition-all disabled:opacity-0 disabled:pointer-events-none z-20 focus:outline-none border border-gray-100">
            <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <button id="nextBtn" class="absolute top-[35%] right-3 -translate-y-1/2 bg-white/90 backdrop-blur-md text-sky-900 p-2.5 rounded-full shadow-lg hover:bg-white hover:scale-110 transition-all disabled:opacity-0 disabled:pointer-events-none z-20 focus:outline-none border border-gray-100">
            <i data-lucide="chevron-right" class="w-6 h-6"></i>
        </button>

        <!-- Dots & Info Area -->
        <div class="bg-white rounded-b-[2rem] px-6 pb-8">
            <div class="flex justify-center flex-wrap space-x-1.5 mb-2" id="dots-container">
                <!-- Dots generated by JS -->
            </div>
        </div>
    </div>

    <script>
        // ข้อมูลขั้นตอนการผูก Gnat Hitch
        const stepsData = [
            { title: "คล้องเชือก", desc: "เริ่มโดยการพาดปลายเชือกรอบวัตถุหรือเสาที่ต้องการผูก" },
            { title: "พาดทับเส้นหลัก", desc: "นำปลายเชือก (Working End) พาดทับเชือกเส้นหลัก (Standing Part)" },
            { title: "อ้อมด้านหลัง", desc: "อ้อมปลายเชือกไปทางด้านหลังของเชือกเส้นหลัก" },
            { title: "พาดข้ามอีกครั้ง", desc: "นำปลายเชือกอ้อมกลับมาพาดทับบนตัวมันเองและเส้นหลัก" },
            { title: "เตรียมสอดปลาย", desc: "จัดระเบียบห่วงที่เกิดขึ้นเพื่อเตรียมการสอดปลายเชือกในขั้นตอนสุดท้าย" },
            { title: "สอดผ่านห่วง", desc: "สอดปลายเชือกเข้าไปในห่วงที่สร้างไว้จากด้านล่างขึ้นบน" },
            { title: "ดึงให้แน่น", desc: "ดึงปลายเชือกและเชือกเส้นหลักพร้อมกันเพื่อรัดเงื่อนให้แน่นสมบูรณ์" }
        ];

        const track = document.getElementById('slider-track');
        const dotsContainer = document.getElementById('dots-container');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        let currentIndex = 0;

        // สร้าง Slides
        function createSlides() {
            stepsData.forEach((step, i) => {
                const imgNum = i + 1;
                const isLast = i === stepsData.length - 1;
                
                const slide = document.createElement('div');
                slide.className = 'w-full flex-shrink-0 flex flex-col slide-item';
                slide.innerHTML = `
                    <div class="h-64 sm:h-80 image-placeholder w-full flex items-center justify-center border-b-4 ${isLast ? 'border-emerald-500' : 'border-sky-600'} relative overflow-hidden">
                        <div class="absolute top-3 right-3 text-white text-[10px] font-bold px-2.5 py-1 rounded-full z-10 shadow-sm ${isLast ? 'bg-emerald-600' : 'bg-sky-600'}">
                            ${imgNum} / ${stepsData.length}
                        </div>
                        <img class="knot-image" 
                             src="https://www.animatedknots.com/photos/gnat/gnatR${imgNum}.jpg" 
                             alt="Gnat Hitch Step ${imgNum}" 
                             onerror="this.src='https://via.placeholder.com/400x300?text=Image+Not+Found'">
                    </div>
                    <div class="p-8 text-center bg-white h-44 flex flex-col justify-center">
                        <h2 class="text-xl font-bold mb-3 ${isLast ? 'text-emerald-700' : 'text-sky-900'}">
                            ขั้นตอนที่ ${imgNum}: ${step.title}
                        </h2>
                        <p class="text-gray-600 leading-relaxed text-sm sm:text-base">
                            ${step.desc}
                        </p>
                    </div>
                `;
                track.appendChild(slide);

                // สร้าง Dots
                const dot = document.createElement('div');
                dot.className = `h-1.5 rounded-full transition-all duration-300 cursor-pointer ${i === 0 ? 'w-6 bg-sky-600' : 'w-1.5 bg-gray-300'}`;
                dot.addEventListener('click', () => goToSlide(i));
                dotsContainer.appendChild(dot);
            });
        }

        function goToSlide(index) {
            currentIndex = index;
            const total = stepsData.length;
            
            // เลื่อน Track
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            
            // อัปเดตปุ่ม
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === total - 1;
            
            // อัปเดต Dots
            const dots = dotsContainer.querySelectorAll('div');
            dots.forEach((dot, i) => {
                if (i === currentIndex) {
                    dot.className = `h-1.5 rounded-full transition-all duration-300 cursor-pointer w-6 ${i === total - 1 ? 'bg-emerald-500' : 'bg-sky-600'}`;
                } else {
                    dot.className = 'h-1.5 rounded-full transition-all duration-300 cursor-pointer w-1.5 bg-gray-300';
                }
            });
        }

        nextBtn.addEventListener('click', () => {
            if (currentIndex < stepsData.length - 1) goToSlide(currentIndex + 1);
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) goToSlide(currentIndex - 1);
        });

        // Swipe Support
        let startX = 0, isDragging = false;

        track.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
            track.style.transition = 'none';
        }, {passive: true});

        track.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const currentX = e.touches[0].clientX;
            const diffX = startX - currentX;
            track.style.transform = `translateX(calc(-${currentIndex * 100}% - ${diffX}px))`;
        }, {passive: true});

        track.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            track.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
            const diff = startX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) {
                if (diff > 0 && currentIndex < stepsData.length - 1) currentIndex++;
                else if (diff < 0 && currentIndex > 0) currentIndex--;
            }
            goToSlide(currentIndex);
        });

        // Initialize
        createSlides();
        lucide.createIcons();
        goToSlide(0);

        window.addEventListener('resize', () => goToSlide(currentIndex));
    </script>
</body>
</html>
