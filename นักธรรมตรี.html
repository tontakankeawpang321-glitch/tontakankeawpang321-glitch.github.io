<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>นักธรรม</title>
<!-- Import Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Maitree:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #854D0E; /* สีทองแก่/น้ำตาลไหม้ */
    --primary-light: #B45309; 
    --accent: #F59E0B; /* สีทองสว่าง */
    --gold-gradient: linear-gradient(135deg, #B45309 0%, #F59E0B 100%);
    --bg-page: #FDFBF7;
    --text-main: #1F2937;
    --text-sub: #6B7280;
    --shadow-card: 0 4px 15px rgba(133, 77, 14, 0.08);
    --shadow-hover: 0 10px 25px rgba(245, 158, 11, 0.2);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: "Sarabun", sans-serif;
    background-color: var(--bg-page);
    background-image: radial-gradient(#F59E0B 0.5px, transparent 0.5px), radial-gradient(#F59E0B 0.5px, var(--bg-page) 0.5px);
    background-size: 30px 30px;
    background-position: 0 0, 15px 15px;
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* Header Design */
  header {
    width: 100%;
    padding: 30px 20px 20px;
    text-align: center;
    background: linear-gradient(to bottom, #FFFFFF, rgba(255,255,255,0));
    margin-bottom: 10px;
    border-bottom-left-radius: 30px;
    border-bottom-right-radius: 30px;
  }

  .logo-icon {
    width: 60px;
    height: 60px;
    background: var(--gold-gradient);
    border-radius: 50%; /* เปลี่ยนเป็นวงกลมให้ดูเหมือนธรรมจักร/เหรียญ */
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 10px;
    box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2);
    color: white;
  }
  
  .logo-icon svg {
    width: 32px;
    height: 32px;
    fill: currentColor;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
  }

  header h1 {
    font-family: "Maitree", serif;
    font-size: 1.8rem;
    color: var(--primary);
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: -0.5px;
  }

  header p {
    font-family: "Maitree", serif;
    color: var(--text-sub);
    font-size: 0.9rem;
  }

  /* Container */
  .container {
    width: 100%;
    max-width: 600px;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Facebook Section */
  .fb-wrapper {
    background: white;
    border-radius: 16px;
    padding: 0;
    display: flex;
    justify-content: center;
    box-shadow: var(--shadow-card);
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.05);
  }
  
  .fb-page, .fb-page span, .fb-page iframe {
    width: 100% !important;
  }

  /* --- Grid Layout 2 Columns --- */
  .menu-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* แบ่งเป็น 2 คอลัมน์เท่ากัน */
    gap: 12px;
  }

  /* Card Design ปรับเป็นแนวตั้ง */
  .doc-card {
    position: relative;
    display: flex;
    flex-direction: column; /* เรียงไอคอนไว้บน ข้อความไว้ล่าง */
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #FFFFFF;
    border-radius: 20px;
    padding: 20px 10px;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(245, 158, 11, 0.1);
    height: 100%; /* ให้การ์ดสูงเท่ากัน */
  }

  .doc-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
    border-color: rgba(245, 158, 11, 0.5);
  }

  .doc-card:active {
    transform: scale(0.96);
  }

  /* Icon Box Styles */
  .icon-box {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 0; /* เอา margin ขวาออก */
    margin-bottom: 12px; /* เพิ่มระยะห่างด้านล่างแทน */
    background: linear-gradient(135deg, #FFF7ED 0%, #FEF3C7 100%);
    color: var(--primary);
    box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.15);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .doc-card:hover .icon-box {
    background: var(--gold-gradient);
    color: white;
    transform: scale(1.1);
    box-shadow: 0 8px 12px -3px rgba(245, 158, 11, 0.4);
  }

  .icon-box svg {
    width: 30px;
    height: 30px;
    fill: currentColor;
  }

  /* Text Styling */
  .card-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 100%;
  }

  .card-title {
    font-family: "Maitree", serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.3;
    margin-bottom: 4px;
  }

  .card-desc {
    font-size: 0.75rem;
    color: var(--text-sub);
    font-weight: 400;
    display: block; /* แสดงคำอธิบาย */
  }

  /* ซ่อนลูกศรในโหมด Grid เพื่อความสะอาดตา */
  .arrow-wrapper {
    display: none;
  }

  /* Footer */
  .footer {
    width: 100%;
    text-align: center;
    margin-top: 30px;
  }
  
  .footer a {
    color: var(--text-sub);
    text-decoration: none;
    font-size: 0.8rem;
    font-family: "Maitree", serif;
    opacity: 0.7;
  }

  /* Media Query: หน้าจอใหญ่ปรับ Grid กว้างขึ้น */
  @media (min-width: 640px) {
    .menu-list {
      grid-template-columns: repeat(3, 1fr); /* Tablet/PC เป็น 3 คอลัมน์ */
      gap: 20px;
    }
    .doc-card {
      padding: 24px 16px;
    }
  }

</style>
</head>
