<title>นักธรรม</title>
<!-- Import Fonts: Maitree สำหรับหัวข้อ (ดูขลัง/ทางการ) + Sarabun สำหรับเนื้อหา -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Maitree:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #92400E; /* สีน้ำตาลทองเข้ม */
    --primary-light: #B45309; 
    --accent: #F59E0B; /* สีทองสว่าง */
    --gold-gradient: linear-gradient(135deg, #B45309 0%, #F59E0B 100%);
    --bg-page: #FDFBF7;
    --text-main: #1F2937;
    --text-sub: #6B7280;
    --shadow-card: 0 4px 20px rgba(146, 64, 14, 0.08);
    --shadow-hover: 0 10px 25px rgba(245, 158, 11, 0.25);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: "Sarabun", sans-serif;
    background-color: var(--bg-page);
    /* ลายไทยพื้นหลังแบบจางมากๆ */
    background-image: radial-gradient(#F59E0B 0.5px, transparent 0.5px), radial-gradient(#F59E0B 0.5px, var(--bg-page) 0.5px);
    background-size: 30px 30px;
    background-position: 0 0, 15px 15px;
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* Header Design */
  header {
    width: 100%;
    padding: 40px 20px 20px;
    text-align: center;
    background: linear-gradient(to bottom, #FFFFFF, rgba(255,255,255,0));
    margin-bottom: 20px;
    border-bottom-left-radius: 30px;
    border-bottom-right-radius: 30px;
  }

  .logo-icon {
    width: 64px;
    height: 64px;
    background: var(--gold-gradient);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
    box-shadow: 0 8px 15px rgba(245, 158, 11, 0.4);
    color: white;
    transform: rotate(-5deg); /* เอียงนิดๆ ให้ดูมีลูกเล่น */
  }
  
  .logo-icon svg {
    width: 36px;
    height: 36px;
    fill: currentColor;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }

  header h1 {
    font-family: "Maitree", serif;
    font-size: 2rem;
    color: var(--primary);
    font-weight: 700;
    margin-bottom: 5px;
    letter-spacing: -0.5px;
  }

  header p {
    font-family: "Maitree", serif;
    color: var(--text-sub);
    font-size: 0.95rem;
  }

  /* Container */
  .container {
    width: 100%;
    max-width: 600px; /* บีบให้แคบลงเพื่อความสวยงามบนจอคอม */
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Facebook Section */
  .fb-wrapper {
    background: white;
    border-radius: 16px;
    padding: 0;
    display: flex;
    justify-content: center;
    box-shadow: var(--shadow-card);
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.05);
  }
  
  .fb-page, .fb-page span, .fb-page iframe {
    width: 100% !important;
  }

  /* Menu List */
  .menu-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* --- NEW CARD DESIGN --- */
  .doc-card {
    position: relative;
    display: flex;
    align-items: center;
    background: #FFFFFF;
    border-radius: 24px; /* มุมโค้งมนมากขึ้น */
    padding: 18px 20px;
    text-decoration: none;
    transition: all 0.3s ease;
    /* เงาซ้อนกันเพื่อให้ดูลอยตัว */
    box-shadow: 
      0 10px 20px -5px rgba(0, 0, 0, 0.05),
      0 2px 6px -1px rgba(0, 0, 0, 0.02);
    border: 1px solid rgba(245, 158, 11, 0.15); /* ขอบทองจางๆ */
    overflow: hidden;
  }

  /* Gradient Overlay (Effect แสง) */
  .doc-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 70%);
    background-size: 200% 100%;
    transition: background-position 0.5s;
    opacity: 0;
  }

  /* Interaction States */
  .doc-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
    border-color: rgba(245, 158, 11, 0.6); /* ขอบทองเข้มขึ้นเมื่อชี้ */
  }

  .doc-card:hover::before {
    opacity: 1;
    background-position: 100% 0; /* แสงวิ่งผ่าน */
  }

  .doc-card:active {
    transform: scale(0.98);
  }

  /* New Icon Box Design */
  .icon-box {
    width: 56px;
    height: 56px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 18px;
    flex-shrink: 0;
    /* ไล่เฉดสีพื้นหลังไอคอนให้นุ่ม */
    background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%);
    color: var(--primary);
    box-shadow: inset 0 0 0 1px rgba(245, 158, 11, 0.1), 0 4px 6px -2px rgba(245, 158, 11, 0.1);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .doc-card:hover .icon-box {
    background: var(--gold-gradient); /* เปลี่ยนเป็นสีทองเข้มเมื่อชี้ */
    color: white;
    transform: scale(1.1) rotate(-5deg);
    box-shadow: 0 8px 12px -3px rgba(245, 158, 11, 0.4);
  }

  .icon-box svg {
    width: 28px;
    height: 28px;
    fill: currentColor;
    transition: all 0.3s;
  }

  /* Text Styling */
  .card-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .card-title {
    font-family: "Maitree", serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.3;
  }

  .card-desc {
    font-size: 0.85rem;
    color: var(--text-sub);
    font-weight: 400;
    margin-top: 2px;
  }

  /* Chevron Arrow Styling */
  .arrow-wrapper {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #F3F4F6;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }
  
  .arrow-icon {
    width: 18px;
    height: 18px;
    fill: #9CA3AF;
    transition: all 0.3s ease;
  }

  .doc-card:hover .arrow-wrapper {
    background: #FFF7ED;
  }

  .doc-card:hover .arrow-icon {
    fill: var(--primary);
    transform: translateX(2px);
  }

  /* Footer */
  .footer {
    width: 100%;
    text-align: center;
    margin-top: 40px;
  }
  
  .footer a {
    color: var(--text-sub);
    text-decoration: none;
    font-size: 0.85rem;
    font-family: "Maitree", serif;
    opacity: 0.7;
    transition: 0.2s;
  }

  .footer a:hover {
    opacity: 1;
    color: var(--primary);
  }

</style>
