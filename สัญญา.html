<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
      :root {
        --primary-color: #333;
        --secondary-color: #666;
        --bg-color: #fcfcfc;
        --card-bg: #ffffff;
        --border-color: #eee;
      }

      body {
        background-color: var(--bg-color);
        color: var(--primary-color);
        font-family: 'Prompt', sans-serif;
        padding: 40px 20px;
        min-height: 100vh;
      }

      .container {
        max-width: 1000px;
      }

      /* Title Section */
      .app-header {
        margin-bottom: 40px;
        border-bottom: 2px solid var(--primary-color);
        padding-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: end;
      }

      .app-title {
        font-size: 2rem;
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.5px;
      }

      .app-subtitle {
        color: var(--secondary-color);
        font-weight: 300;
        font-size: 0.9rem;
        margin-top: 5px;
      }

      /* Search Box */
      .search-wrapper {
        margin-bottom: 30px;
      }
      
      .search-input {
        background-color: transparent;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 12px 15px;
        font-size: 1rem;
        width: 100%;
        transition: all 0.2s;
      }
      
      .search-input:focus {
        border-color: var(--primary-color);
        outline: none;
        box-shadow: none;
      }

      /* Table Design */
      .table-container {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        overflow: hidden;
      }

      .custom-table {
        width: 100%;
        border-collapse: collapse;
      }

      .custom-table th {
        text-align: left;
        padding: 15px 20px;
        font-weight: 600;
        color: var(--primary-color);
        border-bottom: 2px solid var(--border-color);
        font-size: 0.95rem;
        background-color: #fafafa;
        white-space: nowrap;
      }

      .custom-table td {
        padding: 15px 20px;
        border-bottom: 1px solid var(--border-color);
        vertical-align: middle;
        font-weight: 300;
        color: var(--secondary-color);
      }

      .custom-table tr:hover td {
        background-color: #f9f9f9;
        color: #000;
      }

      .custom-table tr:last-child td {
        border-bottom: none;
      }

      /* Text Badges (แทนรูปภาพ) */
      .category-badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 500;
        text-transform: uppercase;
        padding: 4px 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        color: #555;
        background: #fff;
        min-width: 60px;
        text-align: center;
      }

      /* Link Button */
      .btn-open {
        display: inline-block;
        text-decoration: none;
        color: #000;
        border: 1px solid #000;
        padding: 6px 16px;
        font-size: 0.85rem;
        border-radius: 4px;
        transition: all 0.2s;
        font-weight: 500;
      }

      .btn-open:hover {
        background-color: #000;
        color: #fff;
      }

      /* Pagination */
      .pagination-container {
        margin-top: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 10px;
      }

      .page-btn {
        border: none;
        background: none;
        font-weight: 600;
        cursor: pointer;
        padding: 5px 10px;
        color: #888;
      }
      
      .page-btn:hover { color: #000; }
      .page-btn.active { color: #000; border-bottom: 2px solid #000; }
      .page-btn:disabled { color: #ccc; cursor: default; }

      /* Loading */
      #loading {
        text-align: center;
        padding: 40px;
        color: #999;
        font-weight: 300;
      }
    </style>
  </head>
  <body>

    <div class="container">
      <!-- Header -->
      <div class="app-header">
        <div>
          <h1 class="app-title">สารบัญข้อมูล</h1>
          <div class="app-subtitle">Data Directory System</div>
        </div>
        <button onclick="loadData()" class="btn-open" style="border: 1px solid #ccc; font-weight: 400;">
          รีโหลดข้อมูล
        </button>
      </div>

      <!-- Search -->
      <div class="search-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="พิมพ์เพื่อค้นหาชื่อเอกสาร หรือหมวดหมู่..." onkeyup="filterData()">
      </div>

      <!-- Content -->
      <div class="table-container">
        <div class="table-responsive">
          <table class="custom-table">
            <thead>
              <tr id="tableHeaderRow">
                <!-- Headers จะถูกสร้างโดย JavaScript -->
                <th>ลำดับ</th>
                <th>ชื่อเอกสาร</th>
                <th>หมวดหมู่</th>
                <!-- ลบคอลัมน์ข้อมูลอื่นๆ ออก -->
                <th style="text-align: right;">การกระทำ</th>
              </tr>
            </thead>
            <tbody id="fileTableBody">
              <!-- Data -->
            </tbody>
          </table>
        </div>
        
        <div id="loading">กำลังโหลดข้อมูล...</div>
        <div id="emptyState" style="display: none; padding: 40px; text-align: center; color: #aaa;">
          ไม่พบข้อมูล
        </div>
      </div>

      <!-- Pagination -->
      <div id="paginationFooter" class="pagination-container" style="display: none;">
        <div style="font-size: 0.9rem; color: #888;">
          รายการที่ <span id="startItem">0</span> - <span id="endItem">0</span> จาก <span id="totalItems">0</span>
        </div>
        <div id="paginationControls">
          <!-- Buttons -->
        </div>
      </div>

    </div>

    <script>
      // URL ของ CSV
      const CSV_DATA_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTItiReSbPwa0Fz_Afzmi8BrcUdpzdOINQiV7xFkiKWvl_x1KzmEKItpJjQNjtz1SgheZYdL3s4cSiy/pub?output=csv';
      
      let allData = [];
      let filteredData = [];
      let currentPage = 1;
      const itemsPerPage = 10;
      let headers = [];

      // คอลัมน์ที่สำคัญ (Index)
      let nameIdx = -1;
      let urlIdx = -1;
      let categoryIdx = -1; // ถ้าใน CSV มี
      
      window.onload = loadData;

      function loadData() {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('fileTableBody').innerHTML = '';
        document.getElementById('emptyState').style.display = 'none';
        
        if (CSV_DATA_URL) {
            fetch(CSV_DATA_URL)
                .then(res => res.text())
                .then(csvText => {
                    parseCSV(csvText);
                    renderTable();
                    document.getElementById('loading').style.display = 'none';
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('loading').innerText = 'เกิดข้อผิดพลาดในการโหลดไฟล์ CSV';
                });
        }
      }

      function parseCSV(text) {
        const rows = text.split(/\r\n|\n/).filter(r => r.trim() !== '');
        if (rows.length === 0) return;

        // 1. อ่าน Header
        const headerRow = rows[0].split(',');
        headers = headerRow.map(h => h.trim());

        // 2. หา Index ของคอลัมน์สำคัญ
        // พยายามหาคำว่า 'name', 'ชื่อ' สำหรับชื่อ
        nameIdx = headers.findIndex(h => h.toLowerCase().includes('name') || h.includes('ชื่อ'));
        if (nameIdx === -1) nameIdx = 0; // Default

        // พยายามหาคำว่า 'url', 'link', 'ลิงก์'
        urlIdx = headers.findIndex(h => h.toLowerCase().includes('url') || h.toLowerCase().includes('link') || h.includes('ลิงก์'));
        if (urlIdx === -1) urlIdx = 1; // Default

        // พยายามหาคำว่า 'category', 'หมวด', 'group', 'type'
        categoryIdx = headers.findIndex(h => h.toLowerCase().includes('category') || h.includes('หมวด') || h.toLowerCase().includes('type'));
        
        // 3. อ่านข้อมูล
        allData = [];
        for (let i = 1; i < rows.length; i++) {
            // รองรับ CSV ที่มีเครื่องหมาย " (Quote) ได้เบื้องต้น
            // แต่เพื่อความง่ายจะใช้ split(',') ธรรมดาตามตัวอย่างเดิม
            const cols = rows[i].split(',').map(c => c.trim());
            
            if (cols.length < 2) continue;

            const name = cols[nameIdx] || 'ไม่มีชื่อ';
            const url = cols[urlIdx] || '#';
            
            // หาหมวดหมู่ (Category)
            let category = 'ทั่วไป';
            if (categoryIdx !== -1 && cols[categoryIdx]) {
                category = cols[categoryIdx];
            } else {
                // ถ้าไม่มีคอลัมน์หมวด ให้สร้างจากนามสกุลไฟล์
                if (!name.includes('.')) {
                    category = 'FOLDER';
                } else {
                    const ext = name.split('.').pop().toUpperCase();
                    category = ext;
                }
            }

            allData.push({
                name: name,
                url: url,
                category: category
            });
        }
        filteredData = allData;
      }

      function renderTable() {
        const tbody = document.getElementById('fileTableBody');
        const emptyState = document.getElementById('emptyState');
        const paginationFooter = document.getElementById('paginationFooter');

        tbody.innerHTML = '';
        
        if (filteredData.length === 0) {
            emptyState.style.display = 'block';
            paginationFooter.style.display = 'none';
            return;
        }

        emptyState.style.display = 'none';
        paginationFooter.style.display = 'flex';

        // คำนวณ Pagination
        const start = (currentPage - 1) * itemsPerPage;
        const end = Math.min(start + itemsPerPage, filteredData.length);
        const pageData = filteredData.slice(start, end);

        // สร้าง Row
        let html = '';
        pageData.forEach((item, index) => {
            const realIndex = start + index + 1;
            html += `
            <tr>
                <td style="color: #999; width: 50px;">${realIndex}</td>
                <td style="font-weight: 500; color: #000;">${item.name}</td>
                <td><span class="category-badge">${item.category}</span></td>
                <!-- ลบการแสดงผลคอลัมน์ข้อมูลอื่นๆ -->
                <td style="text-align: right;">
                    <a href="${item.url}" target="_blank" class="btn-open">เปิด</a>
                </td>
            </tr>
            `;
        });
        
        tbody.innerHTML = html;

        // Update Footer Text
        document.getElementById('startItem').innerText = start + 1;
        document.getElementById('endItem').innerText = end;
        document.getElementById('totalItems').innerText = filteredData.length;
        
        renderPaginationControls();
      }

      function renderPaginationControls() {
        const totalPages = Math.ceil(filteredData.length / itemsPerPage);
        const controls = document.getElementById('paginationControls');
        controls.innerHTML = '';

        if (totalPages <= 1) return;

        // ปุ่ม Previous
        const prevBtn = document.createElement('button');
        prevBtn.innerText = '< ก่อนหน้า';
        prevBtn.className = 'page-btn';
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => changePage(currentPage - 1);
        controls.appendChild(prevBtn);

        // แสดงหน้าปัจจุบัน / ทั้งหมด
        const span = document.createElement('span');
        span.innerText = ` หน้า ${currentPage} / ${totalPages} `;
        span.style.color = '#888';
        span.style.fontSize = '0.9rem';
        span.style.margin = '0 10px';
        controls.appendChild(span);

        // ปุ่ม Next
        const nextBtn = document.createElement('button');
        nextBtn.innerText = 'ถัดไป >';
        nextBtn.className = 'page-btn';
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => changePage(currentPage + 1);
        controls.appendChild(nextBtn);
      }

      function changePage(page) {
        currentPage = page;
        renderTable();
      }

      function filterData() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        filteredData = allData.filter(item => {
            return item.name.toLowerCase().includes(query) || 
                   item.category.toLowerCase().includes(query);
        });
        currentPage = 1;
        renderTable();
      }
    </script>
  </body>
</html>
