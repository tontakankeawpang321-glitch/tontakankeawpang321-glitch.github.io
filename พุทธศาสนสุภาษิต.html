<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title>พุทธศาสนสุภาษิต AI (Gemini)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Kodchasan:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --bg: #fffdf5;
            --ink: #2d2a26;
            --muted: #6b655b;
            --line: #eaddcf;
            --brand: #b45309;
            --brand-light: #fff7ed;
            --gold: #f59e0b;
            --radius: 16px;
            --shadow-sm: 0 3px 0 rgba(180, 83, 9, 0.15), 0 8px 20px -12px rgba(0,0,0,.1);
            --shadow-inset: inset 0 2px 0 rgba(255,255,255,.9);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; background: var(--bg); color: var(--ink);
            font-family: "Sarabun", system-ui, sans-serif;
            font-size: 15px; line-height: 1.6;
        }
        h1, h2, h3, h4 { margin: 0 0 8px; font-family: "Kodchasan", sans-serif; }
        .wrap { max-width: 980px; margin: 0 auto; padding: 12px 12px 80px; }
        .section { margin-top: 16px; }

        /* Panel & Cards */
        .panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: 0 10px 25px -20px rgba(0,0,0,.1); }
        .btn {
            appearance: none; border: 1px solid #d7dbe6; background: linear-gradient(#ffffff, #fbf7f0);
            padding: 10px 16px; border-radius: 12px; cursor: pointer; color: var(--ink); font-weight: 700;
            box-shadow: var(--shadow-sm), var(--shadow-inset); transition: all .1s;
            font-family: "Kodchasan", sans-serif;
        }
        .btn:active { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(0,0,0,.06); }
        .btn.primary { border-color: #fbbf24; background: linear-gradient(#fffbeb, #fcd34d); color: #78350f; }

        .searchbar input {
            flex: 1; height: 48px; padding: 0 16px; border: 1px solid var(--line); border-radius: 14px;
            background: #fff; box-shadow: inset 0 2px 6px rgba(0,0,0,.02); font-size: 16px;
        }

        .catbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
        .chip {
            display: flex; align-items: center; gap: 6px; justify-content: center;
            padding: 12px 10px; border-radius: 14px; border: 1px solid var(--line);
            background: #fff; cursor: pointer; font-weight: 600; color: var(--muted);
            font-family: "Kodchasan", sans-serif;
        }
        .chip.active { border-color: #f59e0b; background: #fffbeb; color: #92400e; }

        .card {
            border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: #fff;
            box-shadow: 0 4px 12px -8px rgba(0,0,0,.08); transition: all 0.2s; cursor: pointer;
        }
        .card:hover { transform: translateY(-2px); border-color: var(--gold); background: var(--brand-light); }
        .title { font-size: 18px; font-weight: 700; color: var(--brand); }
        .tag { background: #fff7ed; border: 1px solid #ffedd5; border-radius: 6px; padding: 2px 8px; color: #9a3412; font-size: 12px; }

        /* Chat & Dialogs */
        .chat-bubble { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 15px; }
        .chat-bubble-user { background: var(--brand); color: white; border-bottom-right-radius: 4px; margin-left: auto; }
        .chat-bubble-model { background: #f3f4f6; color: #1f2937; border-bottom-left-radius: 4px; border: 1px solid #e5e7eb; }

        #chatbot-modal, #explain-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1000; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: flex-end;
        }
        @media (min-width: 640px) { #chatbot-modal, #explain-modal { align-items: center; } }

        .modal-content {
            width: 100%; max-width: 500px; background: #fff; border-radius: 24px 24px 0 0;
            display: flex; flex-direction: column; overflow: hidden; height: 80vh;
        }
        @media (min-width: 640px) { .modal-content { border-radius: 24px; height: 70vh; } }

        /* Thinking animation */
        .dots span { animation: blink 1.4s infinite both; }
        .dots span:nth-child(2) { animation-delay: .2s; }
        .dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }

        #fab-chat-toggle {
            position: fixed; bottom: 24px; right: 24px; width: 64px; height: 64px;
            background: linear-gradient(135deg, #b45309, #d97706); color: white;
            border: none; border-radius: 50%; font-size: 28px; z-index: 998;
            box-shadow: 0 8px 20px rgba(180, 83, 9, 0.4); cursor: pointer;
        }
    </style>
</head>
<body>

<main class="wrap">
    <header class="text-center py-6">
        <h1 class="text-3xl font-bold text-orange-800">☸️ พุทธศาสนสุภาษิต</h1>
        <p class="text-gray-600">คู่มือนักธรรม พร้อมคำอธิบาย AI อัจฉริยะ</p>
    </header>

    <!-- สุ่มสุภาษิต -->
    <div class="panel bg-gradient-to-br from-orange-700 to-orange-900 text-white text-center p-8 mb-6" id="highlightBox">
        <p class="text-xs uppercase tracking-widest opacity-75 mb-2">พุทธศาสนสุภาษิตวันนี้</p>
        <h2 id="hl-pali" class="text-2xl font-bold mb-2 italic">...</h2>
        <p id="hl-thai" class="text-lg opacity-90">...</p>
    </div>

    <!-- ค้นหา & หมวดหมู่ -->
    <div class="flex flex-col gap-4 mb-6">
        <div class="flex gap-2">
            <input id="q" type="text" placeholder="ค้นหาคำศัพท์, ความหมาย..." class="flex-1 p-3 border rounded-xl shadow-inner outline-orange-500">
            <button id="btnSearch" class="btn primary">ค้นหา</button>
        </div>
        <div class="catbar" id="levelTabs"></div>
    </div>

    <!-- รายการ -->
    <div class="panel">
        <div class="flex justify-between items-center mb-4">
            <h3 id="panelTitle" class="text-xl font-bold text-orange-800">รายการ</h3>
            <span id="resultCount" class="text-sm text-gray-500"></span>
        </div>
        <div id="list" class="grid gap-3"></div>
        
        <div class="flex justify-center items-center gap-4 mt-8" id="pagination">
            <button id="btnPrev" class="btn">ก่อนหน้า</button>
            <span id="pageInfo" class="font-bold text-gray-600"></span>
            <button id="btnNext" class="btn primary">ถัดไป</button>
        </div>
    </div>
</main>

<!-- Floating Chat Button -->
<button id="fab-chat-toggle">💬</button>

<!-- Chatbot Modal -->
<div id="chatbot-modal">
    <div class="modal-content shadow-2xl">
        <header class="bg-orange-800 text-white p-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🤖</span>
                <div>
                    <h2 class="text-lg font-bold m-0 leading-none">AI สนทนาธรรม</h2>
                    <p class="text-[10px] opacity-70 m-0">พร้อมวิสัชนาทุกข้อธรรม</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button id="new-chat-btn" class="bg-orange-700 px-3 py-1 rounded-lg text-xs font-bold hover:bg-orange-600">เริ่มใหม่</button>
                <button id="close-chat" class="text-2xl font-bold px-2">&times;</button>
            </div>
        </header>
        <div id="chat-history" class="flex-1 overflow-y-auto p-4 space-y-4 bg-orange-50/30">
            <div class="flex items-start gap-2">
                <span class="text-xl">🤖</span>
                <div class="chat-bubble chat-bubble-model">เจริญพร... มีเรื่องทุกข์ใจ หรืออยากสอบถามหลักธรรมข้อใด บอกอาตมาได้เลย</div>
            </div>
        </div>
        <div id="thinking-indicator" class="px-4 py-2 hidden">
            <div class="chat-bubble chat-bubble-model italic text-sm dots">กำลังพิจารณาธรรม<span>.</span><span>.</span><span>.</span></div>
        </div>
        <footer class="p-3 border-t bg-white flex gap-2">
            <input id="user-input" type="text" placeholder="พิมพ์ข้อความ..." class="flex-1 p-3 border rounded-xl focus:ring-2 focus:ring-orange-500 outline-none">
            <button id="send-btn" class="bg-orange-800 text-white px-5 rounded-xl font-bold hover:bg-orange-900">ส่ง</button>
        </footer>
    </div>
</div>

<!-- Explain Dialog Modal -->
<div id="explain-modal">
    <div class="modal-content !h-auto max-h-[90vh]">
        <header class="bg-orange-100 p-4 border-b flex justify-between items-center">
            <h3 class="text-orange-900 font-bold m-0">💡 คำอธิบายโดย AI</h3>
            <button id="close-explain" class="text-2xl">&times;</button>
        </header>
        <div class="p-6">
            <div class="bg-orange-50 border-l-4 border-orange-500 p-4 mb-4">
                <h2 id="exp-pali" class="text-xl font-bold text-orange-900 mb-1">...</h2>
                <p id="exp-thai" class="text-gray-700 italic">...</p>
            </div>
            <div id="exp-loading" class="text-center py-4 text-orange-600 font-bold dots">
                กำลังถอดรหัสความหมาย<span>.</span><span>.</span><span>.</span>
            </div>
            <div id="exp-content" class="text-gray-800 leading-relaxed text-lg font-medium whitespace-pre-line hidden">
            </div>
        </div>
        <footer class="p-4 flex justify-end">
            <button id="close-explain-btn" class="btn primary w-full">เข้าใจแล้ว</button>
        </footer>
    </div>
</div>

<script>
const BACKEND_URL = 'https://supasit.tontakankeawpang.workers.dev/';
const DATA_URLS = {
    'นักธรรมตรี': 'https://raw.githubusercontent.com/tontakankeawpang321-glitch/tontakankeawpang321-glitch.github.io/main/naktam_tri.json',
    'นักธรรมโท': 'https://raw.githubusercontent.com/tontakankeawpang321-glitch/tontakankeawpang321-glitch.github.io/main/naktam_to.json',
    'นักธรรมเอก': 'https://raw.githubusercontent.com/tontakankeawpang321-glitch/tontakankeawpang321-glitch.github.io/main/naktam_ek.json'
};

// คีย์สำหรับเก็บ Cache ใน LocalStorage
const CACHE_KEY_PREFIX = 'dhamma_explain_';

let allProverbs = [];
let currentFilter = [];
let currentPage = 1;
const PAGE_SIZE = 10;
let currentLevel = 'นักธรรมตรี';
let chatHistory = [];

// Helpers
const normalizeKeys = (o) => ({
    pali: o['เรื่อง'] || o.pali || '-',
    thai: o['คำแปล'] || o.thai || '-',
    cat: o['หมวด'] || o.cat || '-',
    id: o['ลำดับ'] || o.id || '-'
});

async function loadData() {
    try {
        const results = await Promise.all(Object.entries(DATA_URLS).map(async ([level, url]) => {
            const res = await fetch(url);
            const json = await res.json();
            const list = Array.isArray(json) ? json : (json.data || []);
            return list.map(item => ({ ...normalizeKeys(item), level }));
        }));
        allProverbs = results.flat();
        renderChips();
        filterAndRender();
        showRandomHighlight();
    } catch (err) { console.error(err); }
}

function showRandomHighlight() {
    const r = allProverbs[Math.floor(Math.random() * allProverbs.length)];
    if(r) {
        document.getElementById('hl-pali').textContent = r.pali;
        document.getElementById('hl-thai').textContent = r.thai;
    }
}

function renderChips() {
    document.getElementById('levelTabs').innerHTML = Object.keys(DATA_URLS).map(lvl => `
        <button class="chip ${lvl===currentLevel?'active':''}" onclick="switchLevel('${lvl}')">📚 ${lvl}</button>
    `).join('');
}

function switchLevel(lvl) {
    currentLevel = lvl;
    currentPage = 1;
    document.getElementById('q').value = '';
    renderChips();
    filterAndRender();
}

function filterAndRender() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    if (q) {
        currentFilter = allProverbs.filter(i => i.pali.toLowerCase().includes(q) || i.thai.toLowerCase().includes(q) || i.cat.toLowerCase().includes(q));
        document.getElementById('panelTitle').textContent = `ผลค้นหา: ${q}`;
    } else {
        currentFilter = allProverbs.filter(i => i.level === currentLevel);
        document.getElementById('panelTitle').textContent = currentLevel;
    }
    document.getElementById('resultCount').textContent = `${currentFilter.length} รายการ`;
    renderList();
}

function renderList() {
    const totalPages = Math.ceil(currentFilter.length / PAGE_SIZE) || 1;
    const items = currentFilter.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);
    
    document.getElementById('list').innerHTML = items.map(item => `
        <article class="card" onclick="explainDialog('${item.pali}', '${item.thai}')">
            <h4 class="title">${item.pali}</h4>
            <p class="text-gray-600 mb-2">${item.thai}</p>
            <div class="flex gap-2">
                <span class="tag">หมวด: ${item.cat}</span>
                <span class="tag !bg-blue-50 !text-blue-700 !border-blue-100">${item.level}</span>
            </div>
        </article>
    `).join('');

    document.getElementById('pageInfo').textContent = `${currentPage} / ${totalPages}`;
    document.getElementById('btnPrev').disabled = currentPage === 1;
    document.getElementById('btnNext').disabled = currentPage === totalPages;
}

async function handleSend() {
    const text = document.getElementById('user-input').value.trim();
    if (!text) return;

    document.getElementById('user-input').value = '';
    addChatBubble(text, true);
    
    document.getElementById('thinking-indicator').classList.remove('hidden');
    document.getElementById('send-btn').disabled = true;

    chatHistory.push({ role: "user", content: text });

    try {
        const res = await fetch(BACKEND_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                mode: "chat",
                message: text,
                history: chatHistory
            })
        });

        const data = await res.json();
        const reply = data.reply || "อาตมาไม่เข้าใจคำถามนี้ ลองใหม่อีกครั้งนะ";

        document.getElementById('thinking-indicator').classList.add('hidden');
        addChatBubble(reply, false);
        
        chatHistory.push({ role: "assistant", content: reply });

    } catch (err) {
        document.getElementById('thinking-indicator').classList.add('hidden');
        addChatBubble("ขออภัย สัญญาณขัดข้อง ลองถามใหม่นะโยม", false);
        chatHistory.pop();
    } finally {
        document.getElementById('send-btn').disabled = false;
        const hist = document.getElementById('chat-history');
        hist.scrollTop = hist.scrollHeight;
    }
}

function addChatBubble(text, isUser) {
    const div = document.createElement('div');
    div.className = `flex items-start gap-2 ${isUser ? 'flex-row-reverse' : ''}`;
    div.innerHTML = `
        <span class="text-xl">${isUser ? '👤' : '🤖'}</span>
        <div class="chat-bubble ${isUser ? 'chat-bubble-user' : 'chat-bubble-model'}">${text.replace(/\n/g, '<br>')}</div>
    `;
    document.getElementById('chat-history').appendChild(div);
}

document.getElementById('new-chat-btn').onclick = () => {
    chatHistory = [];
    document.getElementById('chat-history').innerHTML = `
        <div class="flex items-start gap-2">
            <span class="text-xl">🤖</span>
            <div class="chat-bubble chat-bubble-model">เจริญพร เริ่มสนทนาธรรมบทใหม่ได้เลย</div>
        </div>
    `;
};

// 💎 Proverb Explanation Dialog (With Persistent Cache)
async function explainDialog(pali, thai) {
    const modal = document.getElementById('explain-modal');
    const content = document.getElementById('exp-content');
    const loader = document.getElementById('exp-loading');
    
    document.getElementById('exp-pali').textContent = pali;
    document.getElementById('exp-thai').textContent = thai;
    
    modal.style.display = 'flex';
    content.classList.add('hidden');
    loader.classList.remove('hidden');

    // 1. ตรวจสอบว่ามีข้อมูลในเครื่อง (Cache) หรือไม่
    const cacheKey = CACHE_KEY_PREFIX + pali.replace(/\s+/g, '_');
    const cachedData = localStorage.getItem(cacheKey);

    if (cachedData) {
        // ถ้ามี Cache ให้แสดงทันที ไม่ต้องเรียก AI
        content.textContent = cachedData;
        loader.classList.add('hidden');
        content.classList.remove('hidden');
        return;
    }

    // 2. ถ้าไม่มีใน Cache ให้เรียก AI
    try {
        const res = await fetch(BACKEND_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                mode: "chat",
                message: `ช่วยอธิบายสุภาษิต "${pali}" (${thai}) ให้เป็นข้อคิดสั้นๆ 3 บรรทัด จบใน 3 บรรทัดเท่านั้น`,
                history: []
            })
        });
        const data = await res.json();
        const aiReply = data.reply;

        // 3. บันทึกลง Cache (localStorage) จำไว้ถาวรจนกว่าจะล้างข้อมูลเว็บ
        if (aiReply) {
            localStorage.setItem(cacheKey, aiReply);
        }

        content.textContent = aiReply;
        loader.classList.add('hidden');
        content.classList.remove('hidden');
    } catch (e) {
        content.textContent = "ขออภัย ไม่สามารถดึงข้อมูลได้ในขณะนี้";
        loader.classList.add('hidden');
        content.classList.remove('hidden');
    }
}

// Modal Handlers
document.getElementById('fab-chat-toggle').onclick = () => document.getElementById('chatbot-modal').style.display = 'flex';
document.getElementById('close-chat').onclick = () => document.getElementById('chatbot-modal').style.display = 'none';
document.getElementById('close-explain').onclick = () => document.getElementById('explain-modal').style.display = 'none';
document.getElementById('close-explain-btn').onclick = () => document.getElementById('explain-modal').style.display = 'none';

document.getElementById('send-btn').onclick = handleSend;
document.getElementById('user-input').onkeydown = (e) => { if(e.key==='Enter') handleSend(); };
document.getElementById('btnSearch').onclick = () => { currentPage = 1; filterAndRender(); };
document.getElementById('btnPrev').onclick = () => { if(currentPage > 1) { currentPage--; renderList(); } };
document.getElementById('btnNext').onclick = () => { currentPage++; renderList(); };

loadData();
</script>
</body>
</html>
